# Temas v2 de Zipaquirá · UC Emprendedora e Innovadora (lista propia de esta unidad).
# Versión 2: menos temas (máx. 10) por fusión de los de la versión 1 (respaldada en temas_v1.yaml).
# Anclados a Transformaciones_estrategicas_5_frentes.md · '## 4. UC Emprendedora e Innovadora' · líneas 86-100.
transformacion: UC Emprendedora e Innovadora
version: 2
temas:
- id: acompanamiento_asesoria
  nombre: Acompañamiento, mentoría y asesoría a los proyectos
  componente: Ecosistemas de innovación
  justificacion: 'Componente ''Ecosistemas de innovación'': mentoría continua, estudio de viabilidad e impacto, asesoría legal, empresarial y de investigación, banco de proyectos y mesas de trabajo.'
  critico: false
  instruccion: ¿El `comentario` pide acompañamiento, mentoría, asesoría o estudio de viabilidad para los proyectos?
  criterio_true: Menciona acompañamiento, mentoría, asesoría (legal, empresarial, de investigación), estudio de viabilidad o impacto de los proyectos, banco de proyectos o ideas, mesa de trabajo o canales
    de formación y apoyo.
  criterio_false: No habla de acompañar ni asesorar proyectos.
  ejemplos_si:
  - Un acompañamiento eficiente que asesore la forma del proyecto, su viabilidad y ejecución
  - Mentoría personalizada continua de docentes, investigadores y otro ideadores
- id: financiacion_apoyo_economico
  nombre: Financiación y apoyo económico a los emprendimientos
  componente: Emprendimiento
  justificacion: 'Componente ''Emprendimiento'': presupuesto, apoyo monetario, recursos para ejecutar y apoyo a los emprendimientos de los graduados.'
  critico: false
  instruccion: ¿El `comentario` pide presupuesto, recursos, financiación o apoyo económico para proyectos o emprendimientos?
  criterio_true: Menciona presupuesto, recursos, financiación, apoyo monetario o económico, o apoyo a emprendimientos.
  criterio_false: No menciona recursos económicos ni financiación.
  ejemplos_si:
  - de apoyo monetario para llevar a cabo muchas de los problemas en nuestro territorio
  - Apoyo a emprendimientos y marketing profesional a los graduados
- id: alianzas_sector_cultural
  nombre: Alianzas con el sector cultural y la industria musical
  componente: Relacionamiento con los sectores sociales, productivos, públicos y comunitarios
  justificacion: 'Componente ''Relacionamiento con los sectores sociales, productivos, públicos y comunitarios'': convenios con disqueras, productores, casas de la cultura, instituciones culturales e industria
    musical.'
  critico: false
  instruccion: ¿El `comentario` pide convenios o alianzas con el sector cultural, la industria musical u otras entidades externas?
  criterio_true: Menciona convenios o alianzas con plataformas, disqueras, productores, entidades o instituciones culturales, casas de la cultura, la industria musical o del entretenimiento, o entidades
    y empresas a las que direccionar proyectos.
  criterio_false: No menciona alianzas ni entidades externas.
  ejemplos_si:
  - Convenios con plataformas, disqueras, productores y sector de educación
  - Alianzas estratégicas con instituciones culturales de la región
- id: soluciones_territorio
  nombre: Proyectos que respondan a los problemas del territorio
  componente: Innovación social
  justificacion: 'Componente ''Innovación social'': espacios para discutir y solucionar problemas del territorio, incidir en problemáticas translocales y proyectos de construcción social.'
  critico: false
  instruccion: ¿El `comentario` pide proyectos o espacios para resolver problemas del territorio o de los sectores sociales?
  criterio_true: Menciona problemas o problemáticas del territorio o translocales, sectores sociales o proyectos de construcción social.
  criterio_false: No menciona el territorio ni problemas sociales.
  ejemplos_si:
  - Que hayan espacios donde se discutan los problemas del territorio
  - Banco de Proyectos de construcción social
- id: ordenar_la_casa_docentes
  nombre: 'Primero ordenar la casa: resolver lo interno y comunicarse con los docentes'
  componente: transformacion_en_general
  justificacion: 'Fusión de 2 temas afines de la versión 1 (primero ordenar la casa: resolver lo interno y escuchar a los docentes; comunicación y escucha con los docentes). Ancla: La transformación en
    general.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: primero ordenar la casa: resolver lo interno y escuchar a los docentes; comunicación y escucha con los docentes?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Primero ordenar la casa: resolver lo interno y escuchar a los docentes: dice que hay que resolver problemas internos primero, ordenar la casa,
    o hacer auto observación institucional antes de proyectarse hacia afuera. (2) Comunicación y escucha con los docentes: menciona comunicación asertiva, clara o bidireccional, discusión abierta o escuchar
    a los docentes.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Primero ordenar la casa y después tratar de ayudar a solucionar los problemas del entorno
  - La Universidad tendría que fortalecer una comunicación más asertiva, clara y bidireccional con los docentes
  fusiona_v1:
  - ordenar_la_casa
  - comunicacion_docentes
- id: otros_fuera
  nombre: Otros asuntos fuera de la transformación
  componente: fuera_de_la_transformacion
  justificacion: 'Asuntos sin anclaje en la sección de UC Emprendedora e Innovadora del documento marco, cada uno con menos del 10 % de los comentarios; se agrupan en un solo tema (versión 2). Incluye:
    acceso a la investigación y su articulación con el emprendimiento; acceso a infraestructura, laboratorios y tiempos para trabajar.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos, que no son propios de UC Emprendedora e Innovadora: acceso a la investigación y su articulación con el emprendimiento; acceso
    a infraestructura, laboratorios y tiempos para trabajar?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Acceso a la investigación y su articulación con el emprendimiento: menciona investigación, convocatorias, grupos de investigación o articulación
    entre emprendimiento e investigación. (2) Acceso a infraestructura, laboratorios y tiempos para trabajar: menciona infraestructura, laboratorios, estudios, espacios físicos o extender la jornada.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - ARTICULACIÓN ENTRE EMPRENDIMIENTO E INVESTIGACIÓN.
  - 'Acceso total a infraestructura y laboratorios: Disponibilidad 24/7'
  fusiona_v1:
  - investigacion
  - infraestructura_tiempos
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?
