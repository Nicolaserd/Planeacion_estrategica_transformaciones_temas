# Temas v2 de Ubaté · UC Digital (lista propia de esta unidad).
# Versión 2: menos temas (máx. 10) por fusión de los de la versión 1 (respaldada en temas_v1.yaml).
# Anclados a Transformaciones_estrategicas_5_frentes.md · '## 3. UC Digital' · líneas 66-82.
transformacion: UC Digital
version: 2.2
temas:
- id: inteligencia_artificial
  nombre: Inteligencia artificial en el aprendizaje y en los procesos
  componente: Inteligencia artificial
  justificacion: 'Componente ''Inteligencia artificial'': acceso a la IA, IA institucional, agentes virtuales, IA en procesos administrativos y en el acompañamiento.'
  critico: false
  instruccion: ¿El `comentario` habla de la inteligencia artificial (IA) o de agentes virtuales?
  criterio_true: Menciona inteligencia artificial o IA, agentes de IA o agentes virtuales, IA institucional, o usar la IA en el aprendizaje, el acompañamiento o los procesos.
  criterio_false: No menciona la inteligencia artificial ni agentes virtuales.
  ejemplos_si:
  - desarrollo de una IA institucional para graduados
  - Agentes virtuales que permitan optimizar tareas
- id: automatizacion_procesos
  nombre: Automatización y simplificación de procesos administrativos
  componente: Automatización de procesos
  justificacion: 'Componente ''Automatización de procesos'': trámites integrados y ágiles, menos formatos físicos, unificar el flujo de información y automatizar la contratación.'
  critico: false
  instruccion: ¿El `comentario` pide automatizar, digitalizar o simplificar procesos y trámites administrativos?
  criterio_true: Menciona automatizar o automatización de procesos, trámites ágiles, digitalizar soportes, simplificar procesos sin formatos físicos, unificar el flujo de información entre dependencias,
    optimizar procesos repetitivos o servicios administrativos digitales.
  criterio_false: No habla de automatizar ni simplificar procesos.
  ejemplos_si:
  - Simplificar procesos administrativos sin necesidad de formatos y diligenciamiento físico
  - automatización y optimización en los tiempos de contratación
- id: capacitacion_tecnologica
  nombre: Capacitación en tecnología para docentes, administrativos y estudiantes
  componente: Experiencia digital de la comunidad universitaria
  justificacion: 'Componente ''Experiencia digital de la comunidad universitaria'': formar a toda la comunidad en tecnologías emergentes e IA.'
  critico: false
  instruccion: ¿El `comentario` pide capacitación o formación en tecnología o en IA para docentes, administrativos o estudiantes?
  criterio_true: Menciona capacitación, capacitaciones o formación en tecnología, tecnologías emergentes o IA para docentes, gestores, administrativos o estudiantes.
  criterio_false: No habla de capacitar en tecnología.
  ejemplos_si:
  - Formación en tecnología para los gestores del conocimiento
  - Capacitación en tecnologías emergentes (Uso adecuado de la IA)
- id: plataformas_datos
  nombre: Plataformas integradas, conectividad, datos y ciberseguridad
  componente: Ecosistemas digitales
  otros_componentes:
  - Transformación digital
  justificacion: 'Fusión de 2 temas afines de la versión 1 (integración de plataformas, conectividad y acceso remoto; información en tiempo real, datos y ciberseguridad). Ancla: componente ''Ecosistemas
    digitales''; también toca: Transformación digital.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: integración de plataformas, conectividad y acceso remoto; información en tiempo real, datos y ciberseguridad?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Integración de plataformas, conectividad y acceso remoto: menciona integración o unificación de plataformas, conectividad, acceso desde cualquier
    lugar, VPN, nube, información centralizada o universidad sin fronteras. (2) Información en tiempo real, datos y ciberseguridad: menciona información en tiempo real, administración u optimización de
    datos, ciberseguridad o basura digital.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Unificación de plataformas institucionales
  - Administración y optimización de datos
  fusiona_v1:
  - plataformas_conectividad
  - datos_ciberseguridad
- id: tecnologias_laboratorios
  nombre: Tecnologías emergentes, software, salas y laboratorios para aprender
  componente: Tecnologías emergentes
  otros_componentes:
  - fortalecer el aprendizaje
  justificacion: 'Fusión de 2 temas afines de la versión 1 (tecnologías emergentes y software para aprender; laboratorios, salas y aulas inteligentes). Ancla: componente ''Tecnologías emergentes''; también
    toca: fortalecer el aprendizaje.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: tecnologías emergentes y software para aprender; laboratorios, salas y aulas inteligentes?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Tecnologías emergentes y software para aprender: menciona tecnologías emergentes o nuevas, software propio o innovador, herramientas digitales,
    algoritmos, interactividad en el aprendizaje, CAI en tecnologías o software, o más tecnología para las carreras. (2) Laboratorios, salas y aulas inteligentes: menciona laboratorios, salas de holografía,
    sala de computación, licencias, aulas u oficinas inteligentes.'
  criterio_false: No cumple ninguno de esos casos de forma explícita. Pedir solo IA tiene su propio tema.
  ejemplos_si:
  - Que la universidad tenga software propio creado por los creadores de oportunidades
  - Salas holograficas
  fusiona_v1:
  - tecnologias_aprendizaje
  - salas_laboratorios
- id: servicios_digitales_graduados
  nombre: Servicios digitales para graduados y tienda virtual
  componente: Servicios digitales
  justificacion: 'Componente ''Servicios digitales'': acceso de los graduados a herramientas como la IA, plataformas para graduados y tienda virtual de la unidad agroambiental.'
  critico: false
  instruccion: ¿El `comentario` pide servicios o herramientas digitales para los graduados o una tienda virtual?
  criterio_true: Menciona herramientas, plataformas o IA para graduados, red de graduados, actualización de egresados o tienda virtual.
  criterio_false: No menciona servicios digitales para graduados ni tienda virtual.
  ejemplos_si:
  - El acceso del graduado a herramientas como IA
  - Tienda virtual para la unidad agroambiental
- id: ajustes_enfoque
  nombre: 'Ajustes al enfoque: límites humanos y éticos de la tecnología y metas reales'
  componente: transformacion_en_general
  justificacion: 'Fusión de 2 temas afines de la versión 1 (límites de la tecnología: lo humano, la ética y la desconexión; ajustes al planteamiento: metas reales y agilismo). Ancla: La transformación en
    general.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: límites de la tecnología: lo humano, la ética y la desconexión; ajustes al planteamiento: metas reales y agilismo?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Límites de la tecnología: lo humano, la ética y la desconexión: menciona deshumanización, que la tecnología no reemplace el trabajo humano
    o la educación centrada en las personas, enfoque ético de la IA, descanso o desintoxicación de tecnología, o desacuerdo con el cero papel. (2) Ajustes al planteamiento: metas reales y agilismo: propone
    que el plan diga a dónde se quiere llegar en 2037, que se realice lo escrito, aterrizar los lineamientos en metas reales o incluir conceptos como el agilismo.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - No estamos de acuerdo en el componente de CERO PAPEL
  - Realizar lo que supuestamente esta por escrito
  fusiona_v1:
  - ajustes_humano_etica
  - ajustes_planteamiento
- id: otros_fuera
  nombre: Otros asuntos fuera de la transformación
  componente: fuera_de_la_transformacion
  justificacion: 'Asuntos sin anclaje en la sección de UC Digital del documento marco, cada uno con menos del 10 % de los comentarios; se agrupan en un solo tema (versión 2). Incluye: habilidades laborales
    y vínculo con empresas; medio ambiente y energías renovables; convenios y relación con otras universidades; innovación e ideas propias de la universidad; condiciones y reconocimiento del personal administrativo.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos, que no son propios de UC Digital: habilidades laborales y vínculo con empresas; medio ambiente y energías renovables; convenios
    y relación con otras universidades; innovación e ideas propias de la universidad; condiciones y reconocimiento del personal administrativo?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Habilidades laborales y vínculo con empresas: menciona expresamente el empleo, el ámbito o campo laboral, el dinamismo empresarial, empresas
    o multinacionales, o hacer empresa. (2) Medio ambiente y energías renovables: menciona medio ambiente, cuidado del ambiente o energías renovables. (3) Convenios y relación con otras universidades: menciona
    convenios con otras organizaciones, incluir a otras universidades o diálogo translocal. (4) Innovación e ideas propias de la universidad: menciona expresamente proyectos de innovación, ideas propias
    de la universidad o incentivos para desarrollar el conocimiento propio. (5) Condiciones y reconocimiento del personal administrativo: menciona remuneración administrativa, reconocimiento de horas extras,
    entregas de cargo, socializaciones al personal o avances profesionales de los administrativos.'
  criterio_false: No cumple ninguno de esos casos de forma explícita. Para el trabajo y las empresas, hablar de tecnología, capacitación, IA o innovación sin referirse al trabajo o a empresas no cuenta;
    para las ideas propias, pedir tecnologías emergentes, software o IA no cuenta.
  ejemplos_si:
  - Habilidades fuertes para la salida al ámbito laboral
  - Falta consideración con el medio ambiente, con el cuidado y energías renovables
  - potenciar y mejorar convenios con otras organizaciones
  - Acelerar proyectos de innovación con impacto global
  fusiona_v1:
  - empleo_empresas
  - ambiente_energias
  - convenios_otras_universidades
  - innovacion_ideas_propias
  - condiciones_administrativos
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?
