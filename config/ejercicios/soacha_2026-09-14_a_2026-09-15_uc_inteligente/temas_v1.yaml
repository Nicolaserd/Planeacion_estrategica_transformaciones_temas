# Temas de Soacha · 14-15 sep 2026 · UC Inteligente (lista propia de esta unidad).
# Anclados a los componentes de "UC Inteligente" en contexto/Transformaciones_estrategicas_5_frentes.md (líneas 26-42).
transformacion: UC Inteligente
version: 1
temas:
  - id: datos_evidencia
    nombre: "Gobierno de datos y decisiones basadas en evidencia"
    componente: "Gobierno y uso estratégico de los datos"
    justificacion: "Componente 'Gobierno y uso estratégico de los datos': recolección, análisis y uso de datos, evidencia y medición de resultados para decidir."
    critico: false
    instruccion: "¿El `comentario` pide recolectar, analizar o usar datos, información o evidencias para tomar decisiones o medir resultados?"
    criterio_true: "Menciona datos, análisis de datos, gobierno o gestión de datos, ciencia de datos, evidencia, medir y evaluar resultados, registros o información de estudiantes para decidir."
    criterio_false: "No menciona datos, información ni evidencia. Hablar solo de inteligencia artificial o de tecnología no basta."
    ejemplos_si: ["Flexible con procesos claros de recolección, análisis y aplicación de los datos", "Una universidad que estudie y analice a sus estudiantes"]

  - id: anticipacion_prospectiva
    nombre: "Anticipación, prospectiva y prevención"
    componente: "Inteligencia institucional"
    justificacion: "Componente 'Inteligencia institucional': prospectiva estratégica, detectar tempranamente necesidades, prevenir problemas y la deserción."
    critico: false
    instruccion: "¿El `comentario` pide anticiparse, prever o prevenir problemas o necesidades, o hacer análisis prospectivos?"
    criterio_true: "Menciona anticiparse, prever, prevenir, detectar tempranamente, predecir, prospectiva o evitar que se repitan problemas."
    criterio_false: "No habla de anticipar ni prevenir."
    ejemplos_si: ["Detectar tempranamente las necesidades de la poblacion", "La universidad debe ser capaz de hacer análisis prospectivos"]

  - id: mejora_retroalimentacion
    nombre: "Mejora continua, reconocer errores y retroalimentación"
    componente: "Calidad y mejora continua"
    justificacion: "Componente 'Calidad y mejora continua': mejora continua, planes de mejora, acciones correctivas y reconocer también las dificultades."
    critico: false
    instruccion: "¿El `comentario` pide mejora continua, planes de mejora, corregir errores o reconocer las dificultades para mejorar?"
    criterio_true: "Menciona expresamente la mejora o el mejoramiento continuo, planes de mejora, acciones correctivas, aprender de los errores, retroalimentación o reconocer las dificultades."
    criterio_false: "No menciona expresamente la mejora continua, los errores ni la retroalimentación. Pedir mejorar algo concreto (infraestructura, tecnología, espacios, procesos, clases) no cuenta."
    ejemplos_si: ["La mejora continua", "reconocer y analizar tanto los aciertos como las dificultades es fundamental para identificar oportunidades de mejora"]

  - id: inteligencia_artificial
    nombre: "Inteligencia artificial: uso correcto, regulación e integración"
    componente: "Inteligencia artificial"
    justificacion: "Componente 'Inteligencia artificial': integrar la IA en la educación y los procesos, con regulación, uso responsable y sin perder la libertad ni el pensamiento propio."
    critico: false
    instruccion: "¿El `comentario` habla de la inteligencia artificial (IA): implementarla, usarla bien, regularla o sus límites?"
    criterio_true: "Menciona inteligencia artificial o IA: su implementación en la educación o en los procesos, su uso correcto o responsable, su regulación, o trabajar junto con ella."
    criterio_false: "No menciona la inteligencia artificial."
    ejemplos_si: ["La implementaron de Inteligencia Artificial en procesos Burocraticos", "correcto uso de las nuevas tecnologias(IA) para q los estudiantes la usen como una herramienta mas"]

  - id: procesos_administrativos
    nombre: "Organización y agilidad de procesos (matrículas, ingreso, horarios, plataforma)"
    componente: "Gestión orientada a resultados"
    justificacion: "Componente 'Gestión orientada a resultados': resolver problemas internos de matrículas, horarios, ingreso e inscripción; procesos simples, flexibles y con respuesta."
    critico: false
    instruccion: "¿El `comentario` pide organizar, simplificar o agilizar procesos administrativos como matrículas, inscripciones, horarios, ingreso o respuestas a solicitudes?"
    criterio_true: "Menciona procesos administrativos, matrículas, inscripción de materias, horarios, ingreso a la universidad, admitidos, organización de la plataforma, respuesta a trámites, simplificar o automatizar procesos."
    criterio_false: "No habla de procesos administrativos."
    ejemplos_si: ["semestre tras semestre se generan problemas con las matrículas y horarios", "Con procesos flexibles que permitan adaptarse a las necesidades reales de las áreas"]

  - id: acreditacion_posicionamiento
    nombre: "Acreditación, reconocimiento y posicionamiento"
    componente: "Acreditación institucional"
    justificacion: "Componente 'Acreditación institucional': acreditación de todas las unidades y programas, subir en el ranking y ser reconocida frente a otras universidades."
    critico: false
    instruccion: "¿El `comentario` habla de acreditación, ranking, reconocimiento o posicionamiento de la universidad?"
    criterio_true: "Menciona acreditación, alta calidad, ranking, reconocimiento o posicionamiento departamental, nacional o internacional, o comparación con otras universidades."
    criterio_false: "No menciona acreditación, reconocimiento ni posicionamiento."
    ejemplos_si: ["lograr acreditación Institucional en todas las unidades regionales", "Posicionada y reconocida ante la competencia universitaria a nivel nacional"]

  - id: participacion_cocreacion
    nombre: "Gobernanza participativa, cocreación y comunicación"
    componente: "Gobernanza estratégica"
    justificacion: "Componente 'Gobernanza estratégica': cocreación con todas las partes, participación en la interpretación de los datos, gobernanza adaptativa y comunicación clara."
    critico: false
    instruccion: "¿El `comentario` pide participación, cocreación o mejor comunicación de la comunidad en la gobernanza y las decisiones?"
    criterio_true: "Menciona cocreación, participación de estudiantes, docentes y administrativos, gobernanza, comunicación asertiva o problemas de comunicación."
    criterio_false: "No habla de participación, gobernanza ni comunicación."
    ejemplos_si: ["Plantear una coc creación con todos las partes que conforman la universidad", "se fortalezca la participación de docentes, estudiantes y administrativos en la interpretación de esa información"]

  - id: calidad_ensenanza
    nombre: "Calidad de la enseñanza, docentes y planes de estudio"
    componente: "Calidad y mejora continua"
    justificacion: "Componente 'Calidad y mejora continua': docentes capacitados, clases dinámicas, planes de estudio y verificación del aprendizaje."
    critico: false
    instruccion: "¿El `comentario` pide mejorar las clases, los docentes, los planes de estudio o el seguimiento del aprendizaje?"
    criterio_true: "Menciona mejoras en las clases, clases más dinámicas o prácticas, docentes capacitados, planes de estudio o PAD, o verificar que el estudiante aprende."
    criterio_false: "No habla de la enseñanza ni de los planes de estudio."
    ejemplos_si: ["Gestores de conocimiento capacitados y actualizados.", "una mejora en los planes de estudio con clases más dinámicas"]

  - id: financiacion_inversion
    nombre: "Presupuesto e inversión"
    componente: "Gestión orientada a resultados"
    justificacion: "Componente 'Gestión orientada a resultados': mejorar el presupuesto e invertir para cumplir los objetivos."
    critico: false
    instruccion: "¿El `comentario` pide más presupuesto o inversión?"
    criterio_true: "Menciona presupuesto, inversión o recursos económicos."
    criterio_false: "No menciona presupuesto ni inversión."
    ejemplos_si: ["mejora en el presupuesto", "requiere de inversión para desarrollar ambientes tecnológicos"]

  - id: conformidad
    nombre: "Conformidad con la transformación (sin ajustes)"
    componente: transformacion_en_general
    justificacion: "Comentarios sobre la transformación como un todo: dicen expresamente que el enfoque está bien o que por ahora no ajustarían."
    critico: false
    instruccion: "¿El `comentario` dice expresamente que no haría ajustes o que el enfoque de la transformación está bien tal como está?"
    criterio_true: "Dice de forma explícita que el enfoque fortalece el proceso, que está de acuerdo o que por ahora no ajustaría nada."
    criterio_false: "Pide, propone o menciona cualquier cosa por mejorar."
    ejemplos_si: ["El enfoque que se está dando es el que fortalece el proceso", "Por ahora no mucho, quizá más adelante"]

  - id: tecnologia
    nombre: "Tecnología e innovación tecnológica"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente; el documento lo ubica en UC Digital ('Tecnologías emergentes')."
    critico: false
    instruccion: "¿El `comentario` pide más tecnología, tecnologías emergentes o innovadoras, o equipos tecnológicos?"
    criterio_true: "Menciona tecnología, nuevas tecnologías, tecnologías emergentes o innovadoras, robots, biometría, tecnología en los salones o en el modelo educativo, o ambientes o infraestructura tecnológica."
    criterio_false: "No menciona tecnología. Hablar solo de inteligencia artificial tiene su propio tema."
    ejemplos_si: ["La implementación de nuevas tecnologías en el modelo educativo", "Implementar más tecnología"]

  - id: infraestructura_espacios
    nombre: "Infraestructura, espacios e instalaciones (incluidas las deportivas)"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente ni en otra transformación de forma explícita; se reporta como fuera."
    critico: false
    instruccion: "¿El `comentario` pide mejorar la infraestructura física, los espacios, las instalaciones o las sedes?"
    criterio_true: "Menciona infraestructura, espacios, instalaciones, edificios, sedes, espacios o instalaciones deportivas, laboratorios o espacios para las carreras."
    criterio_false: "No menciona infraestructura ni espacios físicos."
    ejemplos_si: ["Mejoramiento de estructura física", "Mejora de instalaciones deportivas"]

  - id: empleabilidad_emprendimiento
    nombre: "Empleabilidad, prácticas y emprendimiento"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente; el documento lo ubica en UC Emprendedora e Innovadora."
    critico: false
    instruccion: "¿El `comentario` habla de empleo, prácticas, convenios con empresas, emprendimiento u oportunidades laborales?"
    criterio_true: "Menciona prácticas pagas, convenios con empresas, mercado o campo laboral, oportunidades laborales, emprendimiento, empresas o apoyo a las ideas y proyectos de los estudiantes."
    criterio_false: "No menciona empleo, empresas ni emprendimiento."
    ejemplos_si: ["Convenios con múltiples empresas, con prácticas pagas", "fomentará en ellos el espíritu emprendedor"]

  - id: investigacion
    nombre: "Investigación y semilleros"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente; el documento lo ubica en UC Translocal ('Ciencia, tecnología e innovación')."
    critico: false
    instruccion: "¿El `comentario` pide fortalecer la investigación, los semilleros o los grupos de investigación?"
    criterio_true: "Menciona investigación, semilleros o grupos de investigación."
    criterio_false: "No menciona la investigación."
    ejemplos_si: ["Fortalecer el Semillero de investigación", "Mayor inversión a innovación, a través de semilleros y grupos de investigación"]

  - id: integracion_sedes
    nombre: "Integración entre sedes y carreras"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente; el documento lo ubica en UC Translocal ('Identidad translocal', 'Redes y cooperación')."
    critico: false
    instruccion: "¿El `comentario` pide conectar o integrar a estudiantes y docentes de diferentes sedes o carreras?"
    criterio_true: "Menciona conectar o relacionar sedes, carreras o áreas, compartir conocimientos entre sedes, o trabajo mancomunado entre áreas."
    criterio_false: "No habla de integrar sedes ni carreras."
    ejemplos_si: ["Conectar estudiantes y docentes de diferentes sedes para compartir conocimientos", "Relacionarse más entre las múltiples carreras y sedes"]

  - id: bienestar_lo_humano
    nombre: "Bienestar, valores y lo humano"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente; el documento lo ubica en UC para la Vida."
    critico: false
    instruccion: "¿El `comentario` habla del bienestar, los valores o de no perder lo humano?"
    criterio_true: "Menciona bienestar del estudiante o laboral, valores, que el estudiante se sienta seguro, el factor humano, la esencia del hacer y el sentir o la persona transhumana."
    criterio_false: "No menciona bienestar, valores ni lo humano."
    ejemplos_si: ["Ver el bienestar del estudiante", "No perder la esencia del hacer y el sentir"]

  - id: capacitacion_personal
    nombre: "Capacitación del personal"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente; el documento lo ubica en UC para la Vida ('Desarrollo del talento humano')."
    critico: false
    instruccion: "¿El `comentario` pide capacitar al personal administrativo, de servicios o a los docentes?"
    criterio_true: "Menciona capacitaciones para administrativos o servicios generales, ofimática o docentes capacitados y actualizados."
    criterio_false: "No habla de capacitar al personal."
    ejemplos_si: ["Capacitaciones de offimatica básica tanto para administrativos como para personal de servicios generales"]

  - id: territorio_sociedad
    nombre: "Territorio, sociedad y visión estratégica del entorno"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Inteligente; el documento lo ubica en UC Translocal ('Impacto territorial')."
    critico: false
    instruccion: "¿El `comentario` habla del territorio, la sociedad, el entorno o los problemas sociales y ambientales?"
    criterio_true: "Menciona expresamente el territorio, la región, la sociedad, problemas sociales o ambientales, trabajo de campo en la comunidad o redes latinoamericanas."
    criterio_false: "No menciona expresamente el territorio, la región ni la sociedad. Hablar del entorno académico, de la universidad, de la tecnología o del contexto en general no cuenta."
    ejemplos_si: ["conocimiento del territorio", "Más preparada para responder los problemas de la sociedad"]

sin_contenido: "¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?"
