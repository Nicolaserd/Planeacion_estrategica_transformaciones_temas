# Temas v2 de Chía · UC Translocal (lista propia de esta unidad).
# Versión 2: menos temas (máx. 10) por fusión de los de la versión 1 (respaldada en temas_v1.yaml).
# Anclados a Transformaciones_estrategicas_5_frentes.md · '## 2. UC Translocal' · líneas 46-62.
transformacion: UC Translocal
version: 2.2
temas:
- id: universidad_en_red
  nombre: 'Universidad unida y en red: integración entre sedes'
  componente: Identidad translocal
  justificacion: 'Componente ''Identidad translocal'': territorios conectados sin perder su identidad, ecosistema en red, proyectos y experiencias compartidas entre sedes, igualdad entre sedes.'
  critico: false
  instruccion: ¿El `comentario` pide integrar, unir o conectar las sedes y extensiones, o compartir proyectos y experiencias entre ellas?
  criterio_true: Menciona integración, unión, articulación o conexión entre sedes o extensiones, universidad en red o más unida, compartir experiencias o proyectos entre sedes, igualdad entre sedes o comunicación
    con otras sedes.
  criterio_false: No habla de conectar ni integrar las sedes.
  ejemplos_si:
  - Unir las sedes para poder aprender cosas de cada una de ellas
  - Mayor integración entre sus sedes y territorios
- id: soluciones_territorio
  nombre: Identificar y resolver los problemas de cada territorio
  componente: Impacto territorial
  justificacion: 'Componente ''Impacto territorial'': bancos de problemas, soluciones locales que escalan a otros territorios, trabajos de grado que resuelven problemas reales y respuesta a desempleo, desigualdad
    y brechas.'
  critico: false
  instruccion: ¿El `comentario` pide identificar y resolver problemas o necesidades del territorio, la región o los municipios?
  criterio_true: Menciona identificar o resolver problemas o necesidades del territorio, la región, los municipios o el entorno, banco de problemas translocales, soluciones locales o pertinentes, impacto
    en la región o aprovechar los recursos del territorio.
  criterio_false: No habla de los problemas ni de las necesidades del territorio.
  ejemplos_si:
  - Fortalecer el banco de problemas translocales
  - Integrar la comunidad con problematicas que sea solucionadas realmente de parte de los estudiantes por medio de sus trabajos de grado
- id: articulacion_actores_externos
  nombre: Articulación con alcaldías, entes territoriales y actores del ecosistema
  componente: Interacción Social Universitaria
  justificacion: 'Componente ''Interacción Social Universitaria'': mesas con alcaldías y municipios, clúster con la planeación municipal y departamental, redes con actores del ecosistema y foros con la
    comunidad externa.'
  critico: false
  instruccion: ¿El `comentario` pide articularse o dialogar con alcaldías, gobernaciones, entes territoriales, la comunidad externa u otros actores del territorio?
  criterio_true: Menciona alcaldías, gobernaciones, entes territoriales, planeación municipal o departamental, mesas sectoriales, comunidad externa, sector público, voluntariados, foros, actores del ecosistema
    o ayuda del Estado.
  criterio_false: No habla de actores externos ni de la comunidad del territorio.
  ejemplos_si:
  - Trabajar con los municipios en mesas sectoriales
  - generar mas diálogo con las alcaldias y con sus gobernaciones
- id: identidad_cultural
  nombre: Identidad cultural y diversidad de cada territorio
  componente: reconociendo su diversidad
  justificacion: '''Qué busca'': reconocer la diversidad de los territorios: respetar y promover la cultura, tradiciones e identidad de cada territorio y de la universidad.'
  critico: false
  instruccion: ¿El `comentario` pide reconocer, respetar o promover la identidad, la cultura, las tradiciones o la diversidad de cada territorio?
  criterio_true: Menciona identidad cultural o territorial, cultura, tradiciones, costumbres, diversidad territorial, culturas de cada región, arraigo, o la imagen e identidad de la universidad.
  criterio_false: No habla de identidad, cultura ni diversidad.
  ejemplos_si:
  - Respetar la cultura de cada territorio
  - Promover la identidad cultural y territorial, promoviendo las culturas y tradiciones de los territorios
- id: formacion_calidad
  nombre: Formación de calidad, práctica y con enfoque territorial
  componente: Formación y aprendizaje
  justificacion: 'Componente ''Formación y aprendizaje'': calidad y exigencia académica, proyectos desde los primeros semestres, pasar del aula a la práctica, modalidades y horarios, y contenidos sobre
    el territorio.'
  critico: false
  instruccion: ¿El `comentario` pide mejorar la calidad o la exigencia de la formación, más práctica, o cambios en las materias, modalidades o jornadas?
  criterio_true: Menciona calidad o exigencia académica, enfoque académico, proyectos desde los primeros semestres, pasar de la teoría a la práctica, modalidad virtual o jornada diurna, o contenidos sobre
    el territorio en las materias.
  criterio_false: No habla de la formación ni de lo académico.
  ejemplos_si:
  - Comenzar con proyectos básico para los primeros 3 semestres
  - Articulación regional y calidad academica
- id: investigacion_innovacion
  nombre: Investigación e innovación de alto impacto
  componente: Ciencia, tecnología e innovación
  justificacion: 'Componente ''Ciencia, tecnología e innovación'': investigación articulada y financiada, innovación de alto impacto, ecosistema de innovación y conexión de semilleros.'
  critico: false
  instruccion: ¿El `comentario` pide investigación, innovación, ciencia o semilleros?
  criterio_true: Menciona investigación, innovación, ciencia, tecnología e innovación, semilleros o ecosistema de innovación.
  criterio_false: No menciona investigación, ciencia ni innovación.
  ejemplos_si:
  - Innovación e investigación de alto impacto
  - la investigación debe estar articulada con ls funciones sustantivas para generar impacto
- id: visibilidad_redes
  nombre: Visibilidad, reconocimiento y alianzas con otras universidades
  componente: proyección de la Universidad
  otros_componentes:
  - Redes y cooperación
  justificacion: 'Fusión de 2 temas afines de la versión 1 (visibilidad, reconocimiento y posicionamiento; alianzas con otras universidades, movilidad e internacionalización). Ancla: componente ''proyección
    de la Universidad''; también toca: Redes y cooperación.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: visibilidad, reconocimiento y posicionamiento; alianzas con otras universidades, movilidad e internacionalización?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Visibilidad, reconocimiento y posicionamiento: menciona visibilidad o visibilización, dar a conocer alcances y logros, reconocimiento, credibilidad,
    ranking o más demanda de estudiantes. (2) Alianzas con otras universidades, movilidad e internacionalización: menciona otras universidades, alianzas formativas, interacción entre universidades, viajar
    o conocer otros contextos, o internacionalización.'
  criterio_false: No cumple ninguno de esos casos de forma explícita. Conectar sedes de la misma universidad tiene su propio tema.
  ejemplos_si:
  - Lograría mayor visibilizacion , habrían más demanda de estudiantes
  - Concretar en el propósito de internacionalización
  fusiona_v1:
  - visibilidad_reconocimiento
  - redes_otras_universidades
- id: conformidad
  nombre: Conformidad con la transformación (sin ajustes)
  componente: transformacion_en_general
  justificacion: 'Comentarios sobre la transformación como un todo: dicen expresamente que está clara, que es pertinente, que se enfoca bien o que están de acuerdo.'
  critico: false
  instruccion: ¿El `comentario` dice expresamente que la transformación está bien, es pertinente o que está de acuerdo con ella?
  criterio_true: Dice de forma explícita que todo está claro o perfecto, que la transformación es pertinente o se enfoca bien, que va por el mejor camino, o que está de acuerdo.
  criterio_false: No expresa acuerdo explícito con la transformación; solo pide o propone cosas.
  ejemplos_si:
  - Todo está claro
  - Se enfoca bien
- id: concretar_acciones
  nombre: Que la transformación se concrete en acciones reales
  componente: transformacion_en_general
  justificacion: 'Comentarios sobre la transformación como un todo: más acciones que papel y participación real, no para cumplir indicadores.'
  critico: false
  instruccion: ¿El `comentario` pide que la transformación se traduzca en acciones reales y no se quede en el papel o en indicadores?
  criterio_true: Menciona más actuaciones que papel, acciones reales, no solo cumplir indicadores o generar informes.
  criterio_false: No critica que la transformación se quede en el papel.
  ejemplos_si:
  - Una implementación mas con actuaciones que en papel
  - no por cumplir indicadores o generar informes
- id: otros_fuera
  nombre: Otros asuntos fuera de la transformación
  componente: fuera_de_la_transformacion
  justificacion: 'Asuntos sin anclaje en la sección de UC Translocal del documento marco, cada uno con menos del 10 % de los comentarios; se agrupan en un solo tema (versión 2). Incluye: relación con empresas
    y sector productivo; tecnología, plataformas y aplicaciones; escucha, participación y comunicación interna; bienestar e infraestructura de la sede.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos, que no son propios de UC Translocal: relación con empresas y sector productivo; tecnología, plataformas y aplicaciones; escucha,
    participación y comunicación interna; bienestar e infraestructura de la sede?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Relación con empresas y sector productivo: menciona industria, empresas, empresarios, relacionamiento empresarial o sectores productivos. (2)
    Tecnología, plataformas y aplicaciones: menciona desarrollo digital o tecnológico, inteligencia artificial, metaverso, aplicaciones, plataformas, modalidad virtual o procesos de tecnología. (3) Escucha,
    participación y comunicación interna: menciona escuchar propuestas de estudiantes, participación activa de la comunidad universitaria, comunicación asertiva, canales de información o mejor orden en
    la plataforma. (4) Bienestar e infraestructura de la sede: menciona gimnasio, salón o lugar de descanso, entrada de la universidad o problemas de la persona transhumana.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Relacionamiento empresarial
  - Desarrollo digital, tecnologico e IA.
  - Escuchar propuestas de estudiantes
  - un gimnasio mas equipado,. mejoramiento de la entrada a la universidad
  fusiona_v1:
  - sector_productivo
  - tecnologia_plataformas
  - participacion_comunicacion
  - bienestar_infraestructura
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?
