# Temas de Girardot · 7-8 sep 2026 · UC Emprendedora e Innovadora (lista propia de esta unidad).
# Anclados a los componentes de "UC Emprendedora e Innovadora" en contexto/Transformaciones_estrategicas_5_frentes.md (líneas 86-100).
transformacion: UC Emprendedora e Innovadora
version: 1
temas:
  - id: acompanamiento_ideas
    nombre: "Escuchar, evaluar la viabilidad y acompañar las ideas hasta el final"
    componente: "Ecosistemas de innovación"
    justificacion: "Componente 'Ecosistemas de innovación': escuchar la propuesta, evaluar su viabilidad, orientar, asesorar y acompañar desde el primer boceto hasta la solución final."
    critico: false
    instruccion: "¿El `comentario` pide que la universidad escuche, oriente, asesore o acompañe a quien tiene una idea o proyecto?"
    criterio_true: "Menciona escuchar al creador de oportunidades o su propuesta, evaluar la viabilidad, orientación, guía, asesoría, acompañamiento (también en la opción de grado), seguimiento hasta el final o brindar herramientas y espacios para desarrollar la idea."
    criterio_false: "No habla de escuchar, orientar ni acompañar ideas o proyectos. Pedir solo dinero tiene su propio tema."
    ejemplos_si: ["Primero escuchar al creador de oportunidades, siguiente mirar la viabilidad y luego apoyar", "Ajustaría en no quedarnos solo en el comienzo de un proyecto si no seguir acompañando hasta el final"]

  - id: financiacion_recursos
    nombre: "Financiación: capital semilla, fondos y recursos"
    componente: "Emprendimiento"
    justificacion: "Componente 'Emprendimiento': capital semilla, fondos concursables y fondo propio de emprendimiento, inversión, incentivos económicos y presupuesto."
    critico: false
    instruccion: "¿El `comentario` pide financiación, recursos económicos, inversión o capital semilla para proyectos o emprendimientos?"
    criterio_true: "Menciona capital semilla, fondos (concursables o propios), financiamiento, apoyo económico o financiero, impulso económico, inversión, incentivos económicos, presupuesto o recursos para ejecutar."
    criterio_false: "No menciona dinero, financiación ni recursos económicos."
    ejemplos_si: ["Capital semilla y financiamiento: Crear fondos concursables para financiar prototipos", "Si creamos nuestro propio fondo de emprender , seria genial 10/10"]

  - id: emprendimiento_todas_carreras
    nombre: "Emprendimiento para todas las carreras"
    componente: "cultura institucional emprendedora"
    justificacion: "'Qué busca': 'una cultura institucional emprendedora e innovadora': llevar el emprendimiento a todos los programas (no solo administración), hacerlo transversal, motivar y enamorar a los estudiantes."
    critico: false
    instruccion: "¿El `comentario` pide llevar o adaptar el emprendimiento a todas las carreras o a una carrera específica, o fomentarlo más?"
    criterio_true: "Menciona integrar o adaptar el emprendimiento a todas las carreras o programas, a una carrera concreta (enfermería, software, ambiental), hacerlo transversal o electivo, CAI de emprendimiento, motivar o enamorar del emprendimiento, o pedir más emprendimiento."
    criterio_false: "No habla de extender o fomentar el emprendimiento entre carreras."
    ejemplos_si: ["Porque debería de integrarse todas las carreras y no solo administración de empresas.", "Adaptar el emprendimiento a todos los programas, en especial a enfermería"]

  - id: capacitacion_emprendedores
    nombre: "Capacitación y formación para emprender"
    componente: "Emprendimiento"
    justificacion: "Componente 'Emprendimiento': capacitar en gestión, finanzas, liderazgo y transferencia tecnológica, formación práctica y capacitar a los docentes en emprendimiento."
    critico: false
    instruccion: "¿El `comentario` pide capacitación o formación para emprender, para los estudiantes o para los docentes?"
    criterio_true: "Menciona capacitaciones, formación práctica o continua, herramientas de gestión, finanzas o liderazgo, crear habilidades o capacitar a los gestores en emprendimiento."
    criterio_false: "No habla de capacitar ni formar para emprender."
    ejemplos_si: ["Capacitar a gestores en emprendimiento", "Capacitar al creador de la idea en herramientas de gestión, finanzas, liderazgo y transferencia tecnológica"]

  - id: alianzas_sectores
    nombre: "Alianzas con empresas, entidades y el sector público"
    componente: "Relacionamiento con los sectores sociales, productivos, públicos y comunitarios"
    justificacion: "Componente 'Relacionamiento con los sectores sociales, productivos, públicos y comunitarios': convenios interinstitucionales y empresariales, consultorios para el sector empresarial, alcaldía, colegios y networking."
    critico: false
    instruccion: "¿El `comentario` pide alianzas, convenios o relacionamiento con empresas, entidades, instituciones o el sector público?"
    criterio_true: "Menciona alianzas o convenios con empresas, instituciones o entidades, entidades privadas, la alcaldía, colegios, consultorios para el sector empresarial, networking o relacionamiento con los sectores."
    criterio_false: "No menciona entidades externas ni alianzas."
    ejemplos_si: ["Generar consultorios para el sector empresarial local", "facilitar alianzas con empresas, instituciones y entidades del territorio"]

  - id: soluciones_comunidad
    nombre: "Soluciones reales a problemas de la comunidad y el territorio"
    componente: "Innovación social"
    justificacion: "Componente 'Innovación social': acercarse a la comunidad, conocer su necesidad real, banco de soluciones, proyectos ISU y soluciones con impacto en el territorio."
    critico: false
    instruccion: "¿El `comentario` pide conocer los problemas de la comunidad o el territorio y convertir las ideas en soluciones para ellos?"
    criterio_true: "Menciona la comunidad, el territorio, la región, problemas o necesidades reales, problemáticas sociales, inmersión social, banco de soluciones, proyectos ISU o soluciones con impacto en la comunidad."
    criterio_false: "No menciona la comunidad, el territorio ni problemas sociales."
    ejemplos_si: ["La universidad debe acercarse a la comunidad que presenta algún tipo de problema para poder conocer la necesidad real", "Transformar las ideas de nuestra comunidad en soluciones que generen un verdadero impacto en el territorio."]

  - id: visibilidad_informacion
    nombre: "Visibilizar los emprendimientos y la información de apoyos"
    componente: "cultura institucional emprendedora"
    justificacion: "'Qué busca': promover 'una cultura institucional emprendedora': divulgar los procesos y logros de emprendimiento, informar los apoyos y llegar a graduados y otras universidades."
    critico: false
    instruccion: "¿El `comentario` pide divulgar, visibilizar o informar sobre los emprendimientos, logros o apoyos de la universidad?"
    criterio_true: "Menciona divulgar o dar a conocer los emprendimientos o procesos, visibilizar a los emprendedores, información de los apoyos o logros, reconocimiento o replicarlos a nivel nacional."
    criterio_false: "No habla de divulgación, visibilidad ni información."
    ejemplos_si: ["Divulgar y dar a conocer todos los procesos de emprendimiento que hace en la universidad", "Mayor gestión del alcance de la información de apoyos a los emprendedores."]

  - id: innovacion_tecnologia
    nombre: "Innovación y tecnología en los proyectos"
    componente: "Innovación"
    justificacion: "Componente 'Innovación': innovación en tecnologías emergentes, proyectos innovadores y tecnológicos, estrategias y apoyo tecnológico."
    critico: false
    instruccion: "¿El `comentario` pide innovación, tecnologías o proyectos innovadores y tecnológicos?"
    criterio_true: "Menciona innovación, tecnologías emergentes o eficientes, apoyo o estrategias tecnológicas, o proyectos innovadores, creativos o tecnológicos."
    criterio_false: "No menciona innovación ni tecnología."
    ejemplos_si: ["Ampliación y innovación en tecnologías emergentes.", "Que se manejaran proyectos, innovadores, creativos, tecnológicos"]

  - id: oportunidades_laborales
    nombre: "Creación de oportunidades laborales"
    componente: "Creación de oportunidades"
    justificacion: "Componente 'Creación de oportunidades': más oportunidades laborales y apoyo laboral para estudiantes de todas las carreras."
    critico: false
    instruccion: "¿El `comentario` pide más oportunidades laborales o de otro tipo para los estudiantes?"
    criterio_true: "Menciona oportunidades laborales, apoyo laboral, visión laboral o crear más oportunidades para los estudiantes."
    criterio_false: "No menciona oportunidades laborales."
    ejemplos_si: ["Más oportunidades laborales y apoyo financiero de entidades privadas", "Se creen más oportunidades de oportunidades para las demás carreras"]

  - id: conformidad
    nombre: "Conformidad y valoración positiva (sin ajustes)"
    componente: transformacion_en_general
    justificacion: "Comentarios sobre la transformación como un todo: dicen expresamente que no ajustarían nada, que está bien o completa, o valoran lo que la universidad ya hace."
    critico: false
    instruccion: "¿El `comentario` dice expresamente que no ajustaría nada a la transformación, que está bien o completa, o solo valora lo que la universidad ya hace?"
    criterio_true: "Dice de forma explícita que no ajustaría nada, ningún ajuste, por el momento nada, ta bien, todo perfecto, está completo o bien proyectado, o valora que la universidad ya participa en estos procesos, sin pedir cambios."
    criterio_false: "Pide, propone o menciona cualquier cosa por mejorar."
    ejemplos_si: ["No ajustaría nada ya que pienso que las herramientas que nos dan han sido las óptimas", "Lo que explicaron está completo"]

  - id: investigacion
    nombre: "Investigación, laboratorios abiertos y articulación con CTeI e ISU"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Emprendedora; el documento lo ubica en UC Translocal ('Ciencia, tecnología e innovación', 'Interacción Social Universitaria')."
    critico: false
    instruccion: "¿El `comentario` pide investigación, laboratorios de investigación o articulación con CTeI e ISU?"
    criterio_true: "Menciona investigación o investigaciones, laboratorios de investigación, semilleros, CTeI, CTI o articulación con ISU."
    criterio_false: "No menciona la investigación ni CTeI."
    ejemplos_si: ["Creación de espacios de laboratorio de investigación abiertos", "Articulación con otras dependencias como ISO y CTI"]

  - id: bienestar_cuidado
    nombre: "Bienestar y cuidado (salud mental, madres estudiantes)"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Emprendedora; corresponde a UC para la Vida."
    critico: false
    instruccion: "¿El `comentario` pide salud mental, espacios para los hijos de madres estudiantes u otros servicios de cuidado?"
    criterio_true: "Menciona salud mental, espacio para los hijos de las madres que estudian o puntos de vacunación."
    criterio_false: "No menciona bienestar ni cuidado."
    ejemplos_si: ["Más enfoque en la salud mental", "crear un espacio donde estas mamitas puedan tener a sus hijos"]

  - id: procesos_gestion
    nombre: "Procesos administrativos y comunicación entre áreas"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Emprendedora; el documento lo ubica en UC Inteligente."
    critico: false
    instruccion: "¿El `comentario` pide procesos administrativos más eficientes, calidad en la gestión o mejor comunicación entre áreas?"
    criterio_true: "Menciona procesos administrativos eficientes, calidad en la gestión o comunicación asertiva entre áreas."
    criterio_false: "No habla de procesos ni de gestión."
    ejemplos_si: ["Procesos administrativos más eficientes", "una comunicación asertiva para la articulación efectiva entre las diferentes áreas"]

sin_contenido: "¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?"
