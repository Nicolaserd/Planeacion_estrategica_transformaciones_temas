# Temas de Ubaté · 18-19 ago 2026 · UC Translocal (lista propia de esta unidad).
# Anclados a los componentes de "UC Translocal" en contexto/Transformaciones_estrategicas_5_frentes.md (líneas 46-62).
transformacion: UC Translocal
version: 1
temas:
  - id: conocer_necesidades_territorio
    nombre: "Conocer las necesidades y particularidades de cada territorio y sede"
    componente: "realidades de los territorios"
    justificacion: "'Qué busca': articular las funciones 'con las realidades de los territorios y reconociendo su diversidad': conocer necesidades, cultura y particularidades de cada región y sede."
    critico: false
    instruccion: "¿El `comentario` pide conocer o reconocer las necesidades, particularidades o identidad de cada territorio, región o sede?"
    criterio_true: "Menciona conocer o reconocer las necesidades, particularidades culturales, sociales o económicas, potencialidades o identidad de cada territorio, región, municipio o sede, o datos actualizados de la región."
    criterio_false: "No habla de conocer las realidades de los territorios o las sedes."
    ejemplos_si: ["Que la universidad conozca tambien su territorio e identifique las necesidades", "reconocer las particularidades cultural sociales y económicos de cada region"]

  - id: impacto_territorial
    nombre: "Impacto y desarrollo territorial"
    componente: "Impacto territorial"
    justificacion: "Componente 'Impacto territorial': desarrollo económico, social, ambiental y cultural del territorio y solución de problemáticas locales."
    critico: false
    instruccion: "¿El `comentario` pide que la universidad contribuya al desarrollo del territorio o a resolver sus problemáticas?"
    criterio_true: "Menciona desarrollo territorial o de la región, impacto en el territorio, solucionar problemáticas locales o translocales, cambios sociales o culturales en el territorio, o que el egresado aporte al desarrollo de su región."
    criterio_false: "No habla del desarrollo ni de los problemas del territorio."
    ejemplos_si: ["Desarrollo territorial que incluya lo económico social ambiental y cultural", "Que realmente se logren solucionar problematicas locales evidentes en cada municipio"]

  - id: interaccion_comunidad
    nombre: "Interacción y vínculo con la comunidad"
    componente: "Interacción Social Universitaria"
    justificacion: "Componente 'Interacción Social Universitaria': conectar con líderes comunitarios, vincular a los estudiantes con la comunidad y lograr una interacción real con la comunidad impactada."
    critico: false
    instruccion: "¿El `comentario` pide más interacción o vínculo de la universidad y sus estudiantes con la comunidad?"
    criterio_true: "Menciona interacción con la comunidad, líderes comunitarios, vincular a los estudiantes con la comunidad, unión con comunidades y sectores aledaños o interacción social universitaria (ISU)."
    criterio_false: "No habla de la interacción con la comunidad."
    ejemplos_si: ["Conectar con líderes comunitarios", "Interacción real de la comunidad impactada con los procesos"]

  - id: articulacion_sedes
    nombre: "Articulación e intercambio entre sedes"
    componente: "Identidad translocal"
    justificacion: "Componente 'Identidad translocal': cada sede aporta desde su realidad a una sola universidad; piden engranar seccionales, compartir proyectos y saberes y encuentros entre sedes."
    critico: false
    instruccion: "¿El `comentario` pide unir, articular o conectar las sedes, seccionales y extensiones, o compartir proyectos y saberes entre ellas?"
    criterio_true: "Menciona unión o engranaje de sedes, seccionales o extensiones, trabajo en equipo entre ellas, socializar proyectos o problemáticas entre sedes, encuentros entre graduados de otras sedes o intercambio de saberes."
    criterio_false: "No habla de articular ni conectar las sedes."
    ejemplos_si: ["Realizar un engranaje de todas las secciónales para crear un apoyo entre todos sin perder la esencia de cada una", "Socialización de proyectos entre las sedes"]

  - id: formacion_pertinente_sedes
    nombre: "Programas y formación pertinentes para cada sede"
    componente: "Formación y aprendizaje"
    justificacion: "Componente 'Formación y aprendizaje': programas especializados según el entorno de cada sede, más especializaciones y formar profesionales para problemas regionales."
    critico: false
    instruccion: "¿El `comentario` pide programas, especializaciones o formación acordes al entorno de cada sede o a los problemas regionales?"
    criterio_true: "Menciona programas o carreras según el entorno de cada sede, más especializaciones, formar profesionales con habilidades para problemas regionales, cambios en el aprendizaje o formación alineada a las necesidades de cada sede."
    criterio_false: "No habla de programas ni de formación."
    ejemplos_si: ["Programas que fortalezcan o estén más encaminados, asociados y especializados dependiendo del aprovechamiento del entorno", "E incluir más especializaciónes de los diferentes programas"]

  - id: internacionalizacion
    nombre: "Internacionalización y redes de cooperación"
    componente: "Internacionalización"
    justificacion: "Componente 'Internacionalización' y 'Redes y cooperación': trascender a nivel internacional, redes, alianzas extranjeras y volverse global."
    critico: false
    instruccion: "¿El `comentario` pide trascender a nivel internacional, redes de cooperación o alianzas con el exterior?"
    criterio_true: "Menciona nivel internacional, redes de cooperación, alianzas extranjeras, volverse global o reconocimiento internacional."
    criterio_false: "No menciona lo internacional ni las redes de cooperación."
    ejemplos_si: ["Importante el trascender a nivel internacional, buscar la forma de articularse con redes de cooperación", "dejar de ser translocal y volvernos global"]

  - id: visibilidad_proyeccion
    nombre: "Visibilidad y proyección regional y nacional"
    componente: "proyección de la Universidad"
    justificacion: "'Qué busca': aportar 'a la proyección de la Universidad en el territorio, en el país y en Latinoamérica': divulgar el trabajo, posicionarse y ser reconocida."
    critico: false
    instruccion: "¿El `comentario` pide divulgar el trabajo de la universidad, más visibilidad, posicionamiento o reconocimiento en la región o el país?"
    criterio_true: "Menciona divulgar el trabajo de la universidad, visibilidad, posicionarse, ser reconocida a nivel regional, departamental, nacional o internacional, o llegar más lejos."
    criterio_false: "No habla de visibilidad, divulgación ni reconocimiento."
    ejemplos_si: ["Esto permitirá posicionarnos y tener mayor visibilidad en la región, en el Departamento y en el Pais", "divulgar el trabajo de la universidad en la región"]

  - id: recursos_descentralizados
    nombre: "Recursos y decisiones descentralizadas para cada territorio"
    componente: "desde su propia realidad"
    justificacion: "'Qué busca': cada sede 'expresa esa identidad desde su propia realidad': piden descentralizar los recursos y una política de recursos para estrategias translocales."
    critico: false
    instruccion: "¿El `comentario` pide descentralizar o asignar recursos (económicos o logísticos) para las estrategias de cada territorio?"
    criterio_true: "Menciona descentralizar recursos, asignar recursos logísticos o económicos de manera ágil, o una política de manejo de recursos para estrategias translocales."
    criterio_false: "No menciona recursos ni su descentralización."
    ejemplos_si: ["evaluar la forma de descentralizar los recursos con el fin de solucionar necesidades de cada territorio", "Implementar un política con respecto al manejo de los recursos para diferentes estrategias translocales"]

  - id: investigacion_innovacion
    nombre: "Investigación e innovación con alcance territorial"
    componente: "Ciencia, tecnología e innovación"
    justificacion: "Componente 'Ciencia, tecnología e innovación': que la investigación y la innovación lleguen a todos los sectores y aporten conocimiento."
    critico: false
    instruccion: "¿El `comentario` pide investigación, innovación o ciencia que llegue a los sectores o al territorio?"
    criterio_true: "Menciona investigación, innovación, ciencia, CTI o aportar conocimiento e innovación."
    criterio_false: "No menciona investigación, ciencia ni innovación."
    ejemplos_si: ["El ámbito de investigación llegar a todos los sectores", "aportando más conocimiento e innovación"]

  - id: acreditacion
    nombre: "Acreditación (también internacional) de programas"
    componente: "Acreditación internacional de programas"
    justificacion: "Componente 'Acreditación internacional de programas'."
    critico: false
    instruccion: "¿El `comentario` habla de acreditación de programas, incluida la internacional?"
    criterio_true: "Menciona acreditación o acreditaciones, incluida la acreditación internacional de programas."
    criterio_false: "No menciona acreditación."
    ejemplos_si: ["Acreditación internacional del programó", "Acreditaciones capaces de fomentar el progreso territorial"]

  - id: comunicacion_interna
    nombre: "Comunicación clara dentro de la institución y entre sedes"
    componente: "Identidad translocal"
    justificacion: "Componente 'Identidad translocal': sin una comunicación clara y oportuna dentro de la institución y entre sedes no habrá verdadera identidad translocal."
    critico: false
    instruccion: "¿El `comentario` pide mejorar la comunicación interna de la institución o las herramientas de comunicación entre sedes?"
    criterio_true: "Menciona comunicación interna, que la institución hable de manera clara y oportuna, o herramientas de comunicación entre sedes."
    criterio_false: "No habla de comunicación interna ni entre sedes."
    ejemplos_si: ["La manera de comunicarse dentro de la institución debe ser optimizada", "Diversificación de herramientas para la comunicación entre sedes"]

  - id: conformidad
    nombre: "Conformidad con la transformación (sin ajustes)"
    componente: transformacion_en_general
    justificacion: "Comentarios sobre la transformación como un todo: dicen expresamente que está completa o muy bien."
    critico: false
    instruccion: "¿El `comentario` dice expresamente que la transformación está completa o muy bien y no pide cambios?"
    criterio_true: "Dice de forma explícita que la transformación está completa, muy buena o bien, sin pedir ningún cambio."
    criterio_false: "Pide, propone o menciona cualquier cosa por mejorar o agregar."
    ejemplos_si: ["Se encuentra completo UC translocal 2", "Muy bueno"]

  - id: empleabilidad_empresas
    nombre: "Empleabilidad, empresas y emprendimiento regional"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Translocal; el documento lo ubica en UC Emprendedora e Innovadora."
    critico: false
    instruccion: "¿El `comentario` habla de empleabilidad, convenios o alianzas con empresas o emprendimiento?"
    criterio_true: "Menciona empleabilidad, convenios con empresas o entidades, alianzas con empresas, desarrollo empresarial o emprendimientos."
    criterio_false: "No menciona empleo, empresas ni emprendimiento."
    ejemplos_si: ["ampliar convenios para temas de empleabilidad", "se ayude a impulsar a los emprendimientos del lugar"]

  - id: herramientas_tecnologia
    nombre: "Herramientas digitales y tecnología"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Translocal; el documento lo ubica en UC Digital."
    critico: false
    instruccion: "¿El `comentario` pide herramientas digitales o tecnología?"
    criterio_true: "Menciona herramientas digitales o de fácil acceso, tecnología o integración tecnológica."
    criterio_false: "No menciona herramientas digitales ni tecnología."
    ejemplos_si: ["A través de las Herramientas Digitales aprovecharlas para realizar encuentros", "aportar con tecnología"]

sin_contenido: "¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?"
