# Temas v2 de Chía · UC Inteligente (lista propia de esta unidad).
# Versión 2: menos temas (máx. 10) por fusión de los de la versión 1 (respaldada en temas_v1.yaml).
# Anclados a Transformaciones_estrategicas_5_frentes.md · '## 1. UC Inteligente' · líneas 26-42.
transformacion: UC Inteligente
version: 2.2
temas:
- id: anticipacion_prediccion
  nombre: Anticipación, prevención y predicción
  componente: Inteligencia institucional
  justificacion: 'Componente ''Inteligencia institucional'': pasar de reaccionar a predecir, prospectiva, sistemas de predicción y estar preparados ante crisis.'
  critico: false
  instruccion: ¿El `comentario` pide anticiparse, prever, prevenir o predecir problemas, necesidades o cambios?
  criterio_true: Menciona anticiparse, anticipar, prever, ser prevenidos, predecir, sistema de predicción, prospectiva, visión a futuro o estar preparados para emergencias.
  criterio_false: No habla de anticipar, prevenir ni predecir.
  ejemplos_si:
  - Una universidad que aprende de lo que ocurre y se anticipa, sería capaz de dejar de reaccionar y empezar a predecir
  - Ser prevenidos
- id: decisiones_datos
  nombre: Decisiones basadas en datos e información confiable
  componente: Gobierno y uso estratégico de los datos
  justificacion: 'Componente ''Gobierno y uso estratégico de los datos'': bases de datos adecuadas, analítica, veracidad de los datos y decisiones con datos y no con intuición.'
  critico: false
  instruccion: ¿El `comentario` pide recolectar, analizar o usar datos o información para tomar decisiones o resolver problemas?
  criterio_true: Menciona datos, bases de datos, analítica de datos, datos estadísticos, información previa, veracidad de los datos, seguimiento con datos o decisiones con datos.
  criterio_false: No menciona datos ni información para decidir.
  ejemplos_si:
  - Tomar decisiones con datos, no con intuición
  - Que tenga la capacidad de resolver problemas basado en datos de problemas anteriores
- id: mejora_continua_reconocimiento
  nombre: Mejora continua, aprender de los errores y reconocimiento de la calidad
  componente: Calidad y mejora continua
  otros_componentes:
  - Acreditación institucional
  justificacion: 'Fusión de 2 temas afines de la versión 1 (aprender de los errores, retroalimentación y mejora continua; reconocimiento nacional e internacional y titulación de alta calidad). Ancla: componente
    ''Calidad y mejora continua''; también toca: Acreditación institucional.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: aprender de los errores, retroalimentación y mejora continua; reconocimiento nacional e internacional y titulación de alta calidad?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Aprender de los errores, retroalimentación y mejora continua: menciona aprender de los errores o del pasado, reconocer errores, retroalimentación,
    acciones de mejora, mejora continua, cambio continuo, asegurar la calidad o evaluaciones objetivas. (2) Reconocimiento nacional e internacional y titulación de alta calidad: menciona reconocimiento
    nacional, latinoamericano o internacional, titulación de alta calidad, calidad de la educación o reconocimiento de graduados.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Quien conoce los errores es capaz de retroalimentar y buscar acciones de mejora
  - Ser reconocido a nivel nacional e internacional
  fusiona_v1:
  - aprender_errores_mejora
  - reconocimiento_calidad
- id: gobernanza_comunicacion
  nombre: Gobernanza participativa, transparente y con buena comunicación
  componente: Gobernanza estratégica
  justificacion: 'Fusión de 2 temas afines de la versión 1 (gobernanza participativa, transparente y descentralizada; comunicación y difusión de la información). Ancla: componente ''Gobernanza estratégica''.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: gobernanza participativa, transparente y descentralizada; comunicación y difusión de la información?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Gobernanza participativa, transparente y descentralizada: menciona escuchar o tomar en cuenta la opinión de los actores, participación, cocreación,
    cultura participativa, propuestas de los estudiantes, transparencia en los recursos, gobernanza o decisiones por sede y no solo centralizadas. (2) Comunicación y difusión de la información: menciona
    medios de comunicación, publicar información por más canales, comunicación entre áreas o mejor comunicación.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - es clave tomar en cuenta la opinión de todo es los actores implicados
  - Que diversifiquen la publicación de la información ya que casi todo es por facebook
  fusiona_v1:
  - gobernanza_participativa
  - comunicacion_informacion
- id: inteligencia_artificial
  nombre: Inteligencia artificial en la educación y la gestión
  componente: Inteligencia artificial
  justificacion: 'Componente ''Inteligencia artificial'': incorporar la IA en la educación, en el análisis de datos y en una universidad predictiva.'
  critico: false
  instruccion: ¿El `comentario` habla de la inteligencia artificial (IA)?
  criterio_true: 'Menciona inteligencia artificial o IA: incluirla, incorporarla en la educación o en el análisis de datos, o cursos para usarla.'
  criterio_false: No menciona la inteligencia artificial.
  ejemplos_si:
  - Incluir la IA
  - Universidad Adaptativa y Predictiva impulsada por Inteligencia Artificial
- id: planeacion_organizacion
  nombre: Planeación, organización y agilidad administrativa
  componente: Gestión orientada a resultados
  justificacion: 'Componente ''Gestión orientada a resultados'': planear, organizar, menos papeleo, eliminar cuellos de botella, no trabajar por islas y optimizar recursos.'
  critico: false
  instruccion: ¿El `comentario` pide mejor planeación, organización administrativa, menos papeleo o procesos más ágiles y eficientes?
  criterio_true: Menciona planear, planeación, organización administrativa o interna, menos papeleo, agilizar procesos, cuellos de botella, no trabajar por islas, optimizar procesos o recursos, eficiencia
    o logística.
  criterio_false: No habla de planeación, organización ni agilidad administrativa.
  ejemplos_si:
  - Organizacion administrativa
  - Menos papeleo y más implementación en los gestores de conocimiento
- id: planes_estudio_oferta
  nombre: Planes de estudio, rutas formativas y oferta adaptadas
  componente: Inteligencia institucional
  justificacion: 'Componente ''Inteligencia institucional'': usar lo que se sabe de estudiantes y egresados para adaptar planes de estudio, ritmos, rutas formativas y la oferta de programas.'
  critico: false
  instruccion: ¿El `comentario` pide adaptar los planes de estudio, las rutas formativas, el pensum o la oferta de programas?
  criterio_true: Menciona adaptar o actualizar planes de estudio, pensum, rutas formativas o ritmos de enseñanza, nivelar estudiantes, ajustar los programas según los egresados o el mercado, o más programas
    en todas las sedes.
  criterio_false: No habla de planes de estudio, programas ni oferta académica.
  ejemplos_si:
  - Adaptar los planes de estudio y ritmos de enseñanza según el rendimiento, intereses y dificultades de cada estudiante
  - Seguimiento real a egresados como saber dónde trabajan y qué les faltó, y ajustar los programas con eso
- id: conformidad
  nombre: Conformidad con la transformación (sin ajustes)
  componente: transformacion_en_general
  justificacion: 'Comentarios sobre la transformación como un todo: dicen expresamente que no ajustarían nada o que están de acuerdo.'
  critico: false
  instruccion: ¿El `comentario` dice expresamente que no haría ajustes o que está de acuerdo con la transformación tal como está?
  criterio_true: Dice de forma explícita que no ajustaría o no quitaría nada, que todo está bien enfocado, que está de acuerdo o que la transformación es pertinente.
  criterio_false: Pide, propone o menciona cualquier cosa por mejorar.
  ejemplos_si:
  - No ajustaría nada
  - Nada, todo está enfocado de la mejor manera
- id: territorio_comunidad
  nombre: Territorio, comunidad y problemas de la región
  componente: fuera_de_la_transformacion
  justificacion: No figura en la sección de UC Inteligente; el documento lo ubica en UC Translocal ('Impacto territorial', 'Interacción Social Universitaria').
  critico: false
  instruccion: ¿El `comentario` habla del territorio, la región, la comunidad local o el entorno de cada sede?
  criterio_true: Menciona el territorio, la región, el desarrollo local, la comunidad, instituciones territoriales, el entorno social de cada sede, problemas de la sociedad o ISU.
  criterio_false: No menciona el territorio, la región ni la comunidad externa.
  ejemplos_si:
  - Importante fortalecer los vínculos con las Instituciones territoriales
  - actuar como puente entre el territorio y el conocimiento académico
- id: otros_fuera
  nombre: Otros asuntos fuera de la transformación
  componente: fuera_de_la_transformacion
  justificacion: 'Asuntos sin anclaje en la sección de UC Inteligente del documento marco, cada uno con menos del 10 % de los comentarios; se agrupan en un solo tema (versión 2). Incluye: tecnología, transformación
    digital y programación; investigación aplicada a la región y a la comunidad; redes, movilidad y colaboración con otras universidades; oportunidades laborales y vínculo con empresas; espacios de descanso
    y salones; enfoque en el ser humano y mirada integral.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos, que no son propios de UC Inteligente: tecnología, transformación digital y programación; investigación aplicada a la región y
    a la comunidad; redes, movilidad y colaboración con otras universidades; oportunidades laborales y vínculo con empresas; espacios de descanso y salones; enfoque en el ser humano y mirada integral?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Tecnología, transformación digital y programación: menciona tecnología, desarrollo tecnológico o digital, transformación digital, herramientas,
    programación o implementos para los salones. (2) Investigación aplicada a la región y a la comunidad: menciona investigación, nuevas investigaciones, banco de casos de estudio o investigación para diagnosticar
    problemas. (3) Redes, movilidad y colaboración con otras universidades: menciona otras universidades, relación nacional e internacional, compartir conocimientos con otras instituciones, colaboraciones
    o movilidad. (4) Oportunidades laborales y vínculo con empresas: menciona oportunidades de trabajo, dónde trabajan los egresados, conectar con pequeñas y medianas empresas o crear nuevas oportunidades.
    (5) Espacios de descanso y salones: menciona lugares o salones para descansar o dormir, mejores salones o espacios dedicados a los estudiantes. (6) Enfoque en el ser humano y mirada integral: menciona
    el ser humano, el MEDIT enfocado en el ser humano, no dejar atrás los principios de educación y aprendizaje, o mirar la universidad holísticamente.'
  criterio_false: No cumple ninguno de esos casos de forma explícita. Hablar solo de inteligencia artificial tiene su propio tema.
  ejemplos_si:
  - En transformación digital
  - Crear Banco de Casos de estudio
  - Tenga mayor relación nacional e internacional, compartiendo conocimientos y experiencias con otras instituciones
  - universidad que vonecte con pequeñas y medianas empresas
  fusiona_v1:
  - tecnologia
  - investigacion
  - redes_otras_universidades
  - empleabilidad_oportunidades
  - espacios_descanso
  - lo_humano
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?
