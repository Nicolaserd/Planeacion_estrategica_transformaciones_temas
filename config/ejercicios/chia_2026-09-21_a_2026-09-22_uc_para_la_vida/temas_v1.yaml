# Temas de Chía · 21-22 sep 2026 · UC para la Vida (lista propia de esta unidad).
# Definidos con los 81 comentarios del ejercicio y anclados a los componentes (o a "Qué busca") de
# "UC para la Vida" en contexto/Transformaciones_estrategicas_5_frentes.md (líneas 104-121).
# transformacion_en_general = sobre la transformación como un todo; fuera_de_la_transformacion = sin anclaje.
# Los ejemplos no se envían a Jev.
transformacion: UC para la Vida
version: 1
temas:
  - id: condiciones_reconocimiento_docentes
    nombre: "Condiciones laborales, categorización y reconocimiento de los docentes"
    componente: "Gestores del Conocimiento y el Aprendizaje"
    justificacion: "Componente 'Gestores del Conocimiento y el Aprendizaje': los docentes piden revisar la categorización, reconocer su formación posgradual, contratos más largos, menos sobrecarga y beneficios coherentes."
    critico: false
    instruccion: "¿El `comentario` habla de las condiciones de trabajo de los docentes, su categorización, sus contratos, su carga o el reconocimiento de su formación?"
    criterio_true: "Menciona categorización de docentes o gestores, reconocimiento de la formación posgradual, contratos de corta duración, contratación, beneficios, sobrecarga o responsabilidades administrativas que no corresponden al rol docente."
    criterio_false: "No habla de las condiciones o el reconocimiento de los docentes. Las condiciones de los administrativos tienen su propio tema."
    ejemplos_si: ["la categorización de profesores, debería transformarse", "contratos de corta duración y la asignación de responsabilidades administrativas que no corresponden plenamente a su rol"]

  - id: condiciones_administrativos
    nombre: "Salario, contratos e igualdad para el personal administrativo"
    componente: "Desarrollo del talento humano"
    justificacion: "Componente 'Desarrollo del talento humano': contratos indefinidos, asimilación salarial, carrera administrativa, incentivos, equilibrio vida-trabajo e igualdad frente a otros roles."
    critico: false
    instruccion: "¿El `comentario` habla del salario, los contratos, la carrera administrativa, los incentivos o la igualdad de trato del personal administrativo?"
    criterio_true: "Menciona contratos a término indefinido, asimilación salarial, carrera administrativa, incentivos o salarios, beneficios para las familias, equilibrio entre lo laboral y lo familiar, o igualdad de condiciones y clasismo según el rol."
    criterio_false: "No habla del personal administrativo ni de sus condiciones. Las condiciones de los docentes tienen su propio tema."
    ejemplos_si: ["Asimilación salarial y carrera administrativa", "Contratos a terminos indefinidos, beneficios para nuesyros hijos"]

  - id: bienestar_igualdad
    nombre: "Bienestar y felicidad para toda la comunidad"
    componente: "Felicidad y bienestar"
    justificacion: "Componente 'Felicidad y bienestar': mejorar el bienestar, que llegue en igualdad de condiciones a todos los roles y que la comunidad sea feliz."
    critico: false
    instruccion: "¿El `comentario` pide mejorar el bienestar o la felicidad de la comunidad, o que el bienestar llegue a todos por igual?"
    criterio_true: "Menciona bienestar, bienestar personal, ser felices, apoyo a los estudiantes, o bienestar en igualdad de condiciones para administrativos u otros roles."
    criterio_false: "No menciona bienestar ni felicidad. Las actividades deportivas o recreativas tienen su propio tema."
    ejemplos_si: ["El bienestar en igualdad de condiciones para generar más apropiación de parte del personal administrativo", "Mejorar el bienestar"]

  - id: recreacion_deporte
    nombre: "Actividades recreativas, deportivas y culturales"
    componente: "Felicidad y bienestar"
    justificacion: "Componente 'Felicidad y bienestar': piden volver a las actividades recreativas, grupos deportivos y de arte, gimnasio y espacios lúdicos."
    critico: false
    instruccion: "¿El `comentario` pide actividades recreativas, deportivas, artísticas o lúdicas, o espacios para ellas?"
    criterio_true: "Menciona actividades recreativas, deportivas, lúdicas o artísticas, grupos deportivos o de arte, gimnasio, canchas o espacios lúdicos y recreativos."
    criterio_false: "No menciona actividades recreativas, deportivas ni culturales."
    ejemplos_si: ["Que vuelva a realizar actividades recreativas, como hace unos semestre que traían tarima, canchas inflables", "gimnasiodentro de la u"]

  - id: crecimiento_personal_formacion_integral
    nombre: "Crecimiento personal y formación integral (ser persona antes que profesional)"
    componente: "Persona Transhumana"
    justificacion: "Componente 'Persona Transhumana': conocerse, crecer como persona, autonomía, proyecto de vida, habilidades blandas y 'clases de cómo ser persona antes que profesional'."
    critico: false
    instruccion: "¿El `comentario` habla del crecimiento o desarrollo personal, de conocerse a sí mismo, del proyecto de vida, o de formar a la persona y no solo al profesional?"
    criterio_true: "Menciona crecer o mejorar como persona, conocerse o quererse, autonomía, responsabilidad, proyecto de vida o futuro, habilidades blandas, desarrollo integral, formar para la vida o ser persona antes que profesional."
    criterio_false: "Solo habla de empleo, prácticas, salario, recursos o bienestar, sin referirse al crecimiento de la persona."
    ejemplos_si: ["Clases de cómo ser persona antes que un profesional", "Nos gustaría mejorar cada vez como persona y no solo tener un título"]

  - id: empleabilidad
    nombre: "Empleabilidad y herramientas para la vida laboral"
    componente: "Creadores de Oportunidades"
    justificacion: "Componente 'Creadores de Oportunidades': cómo conseguir trabajo, apoyo para ejercer la profesión y herramientas para la vida laboral."
    critico: false
    instruccion: "¿El `comentario` pide apoyo para conseguir trabajo, ejercer la profesión o prepararse para la vida laboral?"
    criterio_true: "Menciona conseguir trabajo, oportunidades de empleo, ejercer la profesión, vida o campo laboral, herramientas para el trabajo, experiencia laboral o fuentes de ingreso."
    criterio_false: "No habla del empleo o la vida laboral de estudiantes o egresados. Las condiciones del personal de la universidad no cuentan."
    ejemplos_si: ["Cómo puedo conseguir trabajo.", "Que nos apoyen a la hora de intentar de ejercer nuestra profesión"]

  - id: emprendimiento
    nombre: "Emprendimiento y oportunidades de negocio"
    componente: "Creadores de Oportunidades"
    justificacion: "Componente 'Creadores de Oportunidades': crear oportunidades de negocio y tener más de una fuente de ingresos."
    critico: false
    instruccion: "¿El `comentario` pide emprendimiento, oportunidades de negocio o formas de generar ingresos propios?"
    criterio_true: "Menciona emprendimiento, oportunidades de negocio o tener más de una fuente de ingresos."
    criterio_false: "No menciona emprendimiento ni negocios."
    ejemplos_si: ["Se deben crear nuevas oportunidades de negocio en el area de emprendimiento", "herramientas para tener más de una fuente de ingresos"]

  - id: practicas_aprendizaje_aplicado
    nombre: "Prácticas, pasantías y aprendizaje aplicado"
    componente: "condiciones que favorezcan el aprendizaje"
    justificacion: "'Qué busca': 'condiciones que favorezcan el aprendizaje'. Piden prácticas, pasantías, experiencias inmersivas y pasar de la teoría a la práctica."
    critico: false
    instruccion: "¿El `comentario` pide prácticas, pasantías, experiencias inmersivas o aplicar lo aprendido en la práctica?"
    criterio_true: "Menciona prácticas, pasantías, experiencias inmersivas, conocimientos adquiridos de manera práctica, pasar de lo teórico a lo práctico o usar lo aprendido en entornos reales."
    criterio_false: "No pide práctica ni experiencias aplicadas."
    ejemplos_si: ["Practicas  Experiencias inmersivas  Apoyo colectivo", "salir de la parte teórica a la practica"]

  - id: docentes_metodologia_medit
    nombre: "Docentes, metodologías y modelo educativo (MEDIT)"
    componente: "Gestores del Conocimiento y el Aprendizaje"
    justificacion: "Componente 'Gestores del Conocimiento y el Aprendizaje': buenos profesores, metodologías actualizadas, confianza docente-estudiante, comunidades de práctica y el MEDIT."
    critico: false
    instruccion: "¿El `comentario` habla de los docentes, la forma de enseñar, las metodologías o el modelo educativo (MEDIT)?"
    criterio_true: "Menciona buenos profesores o gestores, metodologías actualizadas, la confianza entre docentes y estudiantes, comunidades de práctica, estrategias de enseñanza, el modelo de enseñanza o el MEDIT."
    criterio_false: "No habla de los docentes ni de la enseñanza. Las condiciones laborales de los docentes tienen su propio tema."
    ejemplos_si: ["Contar con los docentes con metodologias actualizadas", "No cambiaria nada el modelo transhumano que maneja el medit me parece muy acertado"]

  - id: formacion_continua
    nombre: "Formación continua: cursos, diplomados y especializaciones"
    componente: "Desarrollo del talento humano"
    justificacion: "Componente 'Desarrollo del talento humano': cursos libres para docentes, diplomados para graduados, especializaciones accesibles y crecimiento en el área de trabajo."
    critico: false
    instruccion: "¿El `comentario` pide cursos, diplomados, especializaciones u otra formación continua para docentes, administrativos o graduados?"
    criterio_true: "Menciona cursos libres, diplomados, especializaciones, posgrados accesibles, formación para gestores o crecimiento de conocimiento en el área de trabajo."
    criterio_false: "No menciona formación continua ni posgrados."
    ejemplos_si: ["Fortalecer formación para los gestores a través de cursos libres", "Diplomados en expresión oral y manejo de cámaras"]

  - id: recursos_laboratorios
    nombre: "Instalaciones, laboratorios y herramientas para aprender"
    componente: "condiciones que favorezcan el aprendizaje"
    justificacion: "'Qué busca': 'condiciones que favorezcan el aprendizaje'. Piden buenas instalaciones, laboratorios, equipamiento y herramientas virtuales."
    critico: false
    instruccion: "¿El `comentario` pide instalaciones, laboratorios, equipamiento o herramientas (incluidas virtuales) para estudiar o investigar?"
    criterio_true: "Menciona instalaciones, laboratorios, equipamiento, logística, herramientas virtuales o recursos para investigar."
    criterio_false: "No menciona instalaciones, laboratorios ni herramientas."
    ejemplos_si: ["tener los mejores laboratorios para un mejor desarrollo en esta carrera", "Tener buenas instalaciones que faciliten y den ganas de estudiar"]

  - id: convivencia_comunidad
    nombre: "Convivencia, solidaridad y vínculos entre personas y sedes"
    componente: "Convivencia"
    justificacion: "Componente 'Convivencia': convivencia, solidaridad, respeto, amistades, trabajo en equipo y compartir con otras sedes."
    critico: false
    instruccion: "¿El `comentario` habla de la convivencia, las relaciones, la solidaridad o el compartir con otras personas o sedes?"
    criterio_true: "Menciona convivencia, solidaridad, amor o respeto hacia los demás, amistades o compañeros, conectar con nuevas personas, trabajo en equipo, multiculturalidad o compartir con otras sedes."
    criterio_false: "No habla de relaciones entre personas ni de convivencia."
    ejemplos_si: ["La manera de la transformación para impactar las acciones del creador de oportunidad ha sido la convivencia.", "Que nos ayuden a compartir más con las otras sedes"]

  - id: valores_etica
    nombre: "Valores, ética y trato respetuoso"
    componente: "Valores democráticos"
    justificacion: "Componente 'Valores democráticos': ética profesional, honestidad, transparencia, respeto, empatía y rechazo al clasismo."
    critico: false
    instruccion: "¿El `comentario` habla de valores, ética, honestidad, respeto o trato igualitario entre las personas?"
    criterio_true: "Menciona valores, ética profesional, honestidad, transparencia, libertad, respeto, empatía o percepción de clasismo."
    criterio_false: "No menciona valores, ética ni trato entre las personas."
    ejemplos_si: ["La universidad transforma la vida por los valores que enseñan honestidad transparencia", "Enseñar todo lo que viene al respecto de ética profesional"]

  - id: oferta_flexibilidad_academica
    nombre: "Oferta y flexibilidad académica"
    componente: "condiciones que favorezcan el aprendizaje"
    justificacion: "'Qué busca': 'condiciones que favorezcan el aprendizaje'. Piden más carreras, poder validar materias sin atrasarse y replantear módulos de aprendizaje."
    critico: false
    instruccion: "¿El `comentario` pide más carreras, flexibilidad para validar o tomar materias, o replantear los módulos o planes de estudio?"
    criterio_true: "Menciona más carreras, validar materias, no atrasarse en el programa, o replantear módulos o planes de aprendizaje."
    criterio_false: "No menciona la oferta académica ni la flexibilidad del plan de estudios."
    ejemplos_si: ["Facilitar las opciones y formas de validar materias para poder ver otras y no atrasarse", "Más carreras"]

  - id: conformidad
    nombre: "Conformidad y agradecimiento (sin ajustes)"
    componente: transformacion_en_general
    justificacion: "Comentarios sobre la transformación como un todo: todo está bien, ningún ajuste, agradecimiento."
    critico: false
    instruccion: "¿El `comentario` dice expresamente que no haría ningún ajuste o cambio a la transformación, o que está de acuerdo con ella tal como está?"
    criterio_true: "Dice de forma explícita que no ajustaría nada, ningún ajuste, que todo está bien o perfecto, que está de acuerdo con la transformación tal como está, o solo agradece, sin pedir nada."
    criterio_false: "Pide, propone o menciona cualquier cosa por mejorar o fortalecer (contratos, bienestar, prácticas, empleo, recursos, etc.). Tampoco cuenta describir experiencias vividas, lo que la universidad aporta o cómo cambió la vida de alguien si no dice explícitamente que no haría ajustes."
    ejemplos_si: ["Nada me parece que todo esta bien y bastante completo", "Altamente agradecidos con la universidad de Cundinamarca"]

  - id: ajustes_enfoque
    nombre: "Ajustes al enfoque: coherencia con la realidad, familia y todos los roles"
    componente: transformacion_en_general
    justificacion: "Comentarios sobre la transformación como un todo: que la 'Universidad Transhumana' se traduzca en condiciones reales, que incluya a la familia y al entorno, a los administrativos, y que sea estable e inclusiva."
    critico: false
    instruccion: "¿El `comentario` propone de forma explícita cambiar el planteamiento o los conceptos de la transformación misma (no pedir acciones concretas)?"
    criterio_true: "Propone explícitamente modificar el enfoque o los conceptos de la transformación: agregar un nuevo frente o a otros actores (familia, administrativos), redefinir la felicidad o la Persona Transhumana, o exigir que el discurso de la transformación se traduzca en condiciones reales."
    criterio_false: "Pide acciones concretas (bienestar, contratos, salario, prácticas, herramientas, recursos, formación) sin cuestionar el planteamiento de la transformación. Describir experiencias, valorar la universidad o una sola palabra sin contexto tampoco cuentan."
    ejemplos_si: ["Falta la complementación de como la Universidad influye por fuera de la vida de la persona, su familia y su entorno", "la apuesta por una Universidad Transhumana requiere traducirse en condiciones y mecanismos de reconocimiento coherentes con la realidad"]

  - id: territorio_proyeccion
    nombre: "Proyección territorial y reconocimiento nacional"
    componente: fuera_de_la_transformacion
    justificacion: "La sección de UC para la Vida no menciona el territorio; el documento lo ubica en UC Translocal ('Impacto territorial', proyección nacional y latinoamericana)."
    critico: false
    instruccion: "¿El `comentario` habla del territorio, lo translocal, la sociedad o el reconocimiento de la universidad a nivel nacional o latinoamericano?"
    criterio_true: "Menciona el territorio, escenarios translocales, la transformación territorial, actuar en la sociedad, el entorno, o ser reconocida a nivel nacional y latinoamericano."
    criterio_false: "No menciona el territorio, la sociedad ni la proyección de la universidad."
    ejemplos_si: ["Debe buscar un desarrollo académico y lograr ser mas reconocido a nivel nacional y latinoamerica", "desde mi profesión también puedo generar transformación en mi territorio"]

  - id: gestion_institucional
    nombre: "Administración y objetivos medibles"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC para la Vida; el documento lo ubica en UC Inteligente ('Gestión orientada a resultados')."
    critico: false
    instruccion: "¿El `comentario` pide mejorar la administración de la universidad o fijar objetivos medibles?"
    criterio_true: "Menciona mejor administración, gestión, objetivos medibles u objetividad SMART."
    criterio_false: "No menciona la administración ni la gestión institucional."
    ejemplos_si: ["Mejor administracion", "Objetividad SMART"]

sin_contenido: "¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?"
