# Temas de Soacha · 14-15 sep 2026 · UC Translocal (lista propia de esta unidad).
# Anclados a los componentes de "UC Translocal" en contexto/Transformaciones_estrategicas_5_frentes.md (líneas 46-62).
transformacion: UC Translocal
version: 1
temas:
  - id: articulacion_sedes
    nombre: "Una sola universidad en red: interacción y movilidad entre sedes"
    componente: "Identidad translocal"
    justificacion: "Componente 'Identidad translocal': dejar de trabajar como sedes aisladas, integrarse en una sola red, movilidad, viajes y proyectos conjuntos entre sedes."
    critico: false
    instruccion: "¿El `comentario` pide integrar, conectar o hacer interactuar a las sedes, o movilidad e intercambios entre ellas?"
    criterio_true: "Menciona interacción, integración, conexión o red entre sedes, dejar de trabajar como sedes aisladas, movilidad, viajes, transporte o intercambios entre sedes, proyectos conjuntos entre programas de distintas sedes, o gestión unificada entre sedes."
    criterio_false: "No habla de conectar ni integrar las sedes."
    ejemplos_si: ["dejamos de trabajar como sedes aisladas y logramos que el conocimiento de un lugar potencie a los demás", "Ampliar la interacción entre sedes y carreras de la universidad"]

  - id: necesidades_impacto_territorio
    nombre: "Responder a las necesidades del territorio e impacto territorial"
    componente: "Impacto territorial"
    justificacion: "Componente 'Impacto territorial': identificar las necesidades del territorio, bancos de problemas translocales e impacto en la sociedad y el entorno."
    critico: false
    instruccion: "¿El `comentario` pide identificar y responder a las necesidades o problemas del territorio, el entorno o las comunidades, o generar impacto territorial?"
    criterio_true: "Menciona necesidades o problemáticas del territorio, del entorno o de las comunidades, impacto territorial, impacto en la sociedad, bancos de problemas translocales, soluciones para el territorio o el contexto local."
    criterio_false: "No habla del territorio ni de sus necesidades."
    ejemplos_si: ["Manejar impacto territorial en base a las necesidades de la comunidades que lo rodean.", "Mantener actualizados los bancos de problemas translocales"]

  - id: identidad_cultura_pertenencia
    nombre: "Identidad, cultura, diversidad y sentido de pertenencia"
    componente: "reconociendo su diversidad"
    justificacion: "'Qué busca': reconocer la diversidad de los territorios: reconocimiento de lo propio, sentido de pertenencia, intercambios culturales y patrimonio de cada unidad regional."
    critico: false
    instruccion: "¿El `comentario` habla de identidad, cultura, diversidad, patrimonio o sentido de pertenencia?"
    criterio_true: "Menciona identidad, reconocimiento de lo propio, sentido de pertenencia, orgullo de dónde se viene, cultura del territorio, intercambios o muestras culturales, diversidad, inclusión o patrimonio y procesos ancestrales."
    criterio_false: "No habla de identidad, cultura ni pertenencia."
    ejemplos_si: ["Reconocimiento de lo propio - Sentido de pertenencia", "Nada, sólo agregar más intercambios culturales"]

  - id: articulacion_actores_externos
    nombre: "Articulación con la comunidad, el Estado y otros actores"
    componente: "Interacción Social Universitaria"
    justificacion: "Componente 'Interacción Social Universitaria': articularse con el Estado, el mercado y la población, actividades con entidades, extensión y participación de comunidades rurales."
    critico: false
    instruccion: "¿El `comentario` pide articularse con la comunidad, el Estado, entidades u otros actores externos, o programas de extensión para comunidades?"
    criterio_true: "Menciona articulación con el Estado, el mercado, la población, el POT, entidades o actores externos, programas de extensión o educación continua para comunidades, participación de comunidades rurales o escuchar a la comunidad."
    criterio_false: "No habla de actores externos ni de la comunidad."
    ejemplos_si: ["Articulación con el estado, mercado, población y POT.", "Impulsar programas de extensión y educación continua para comunidades"]

  - id: formacion_pertinente
    nombre: "Formación pertinente, flexible y llevada a todas las sedes"
    componente: "Formación y aprendizaje"
    justificacion: "Componente 'Formación y aprendizaje': experiencias formativas aterrizadas a la realidad, oferta técnica y tecnológica, y programas (como ciencias del deporte) en otras sedes."
    critico: false
    instruccion: "¿El `comentario` pide una formación más pertinente o flexible, o ampliar la oferta de programas a otras sedes o niveles?"
    criterio_true: "Menciona experiencias formativas aterrizadas a la realidad, lineamientos flexibles, formación que responda a la realidad, enfoque práctico, ofrecer programas técnicos y tecnológicos o llevar programas a otras sedes."
    criterio_false: "No habla de la formación ni de la oferta de programas."
    ejemplos_si: ["Ampliar el proceso desde las técnico y tecnólogo", "implementar este programa en las otras sedes para los estudiantes interesados"]

  - id: investigacion_local
    nombre: "Investigación local con impacto"
    componente: "Ciencia, tecnología e innovación"
    justificacion: "Componente 'Ciencia, tecnología e innovación': potenciar la investigación y adaptarla a las necesidades locales."
    critico: false
    instruccion: "¿El `comentario` pide potenciar la investigación, en especial la local?"
    criterio_true: "Menciona investigación, investigación local o adaptar la investigación a las necesidades locales."
    criterio_false: "No menciona la investigación."
    ejemplos_si: ["Impulsar y promover la investigación local", "Potenciar los procesos de investigación"]

  - id: proyeccion_internacional
    nombre: "Proyección nacional e internacional"
    componente: "Internacionalización"
    justificacion: "Componente 'Internacionalización': ecosistema global, conexión con universidades nacionales e internacionales y crecer a nivel internacional."
    critico: false
    instruccion: "¿El `comentario` habla de lo internacional, lo global o de conexión con otras universidades?"
    criterio_true: "Menciona nivel internacional, ecosistema global o conexión con universidades nacionales e internacionales."
    criterio_false: "No menciona lo internacional ni otras universidades."
    ejemplos_si: ["Conexión entre sedes, y universidades nacionales e internacionales", "Ecosistema global de aprendizaje"]

  - id: ajustes_enfoque
    nombre: "Ajustes al enfoque: concretar, cocrear y atender lo actual"
    componente: transformacion_en_general
    justificacion: "Comentarios sobre la transformación como un todo: que las propuestas se concreten, que los ejes se construyan en cocreación y atender primero lo actual."
    critico: false
    instruccion: "¿El `comentario` cuestiona o propone cambiar la forma en que se plantea la transformación (concretarla, cocrearla o atender primero lo actual)?"
    criterio_true: "Propone que las propuestas se concreten, que los ejes se planteen en cocreación con tiempo, o critica que se mire muy a futuro y no lo actual."
    criterio_false: "Pide acciones concretas sin referirse a cómo se plantea la transformación."
    ejemplos_si: ["En que las propuestas se concreten en algo", "Están viendo muy a futuro, primero deberíamos enfocarnos en lo actual"]

  - id: conformidad
    nombre: "Conformidad con la transformación (sin ajustes)"
    componente: transformacion_en_general
    justificacion: "Comentarios sobre la transformación como un todo: dicen expresamente que no ajustarían o que la universidad va bien."
    critico: false
    instruccion: "¿El `comentario` dice expresamente que no haría ajustes o que la universidad ya trabaja bien en esta transformación?"
    criterio_true: "Dice de forma explícita que no ajustaría nada o que la universidad está trabajando bien, sin pedir cambios."
    criterio_false: "Pide, propone o menciona cualquier cosa por mejorar."
    ejemplos_si: ["Ninguna, considero que la universidad está trabajando bien para que todos los territorios sean considerados"]

  - id: tecnologia_sistemas
    nombre: "Tecnología, internet y sistemas"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Translocal; el documento lo ubica en UC Digital."
    critico: false
    instruccion: "¿El `comentario` pide tecnología, internet, computadores, tableros o registros digitales, o sistemas?"
    criterio_true: "Menciona tecnología, internet, computadores, tableros digitales, registro digital, sistemas o modelo administrativo con tecnología."
    criterio_false: "No menciona tecnología ni sistemas."
    ejemplos_si: ["Mejorar la condición del internet de la universidad y tener libre acceso a los computadores", "Acercar más la tecnología al territorio"]

  - id: infraestructura_bienestar
    nombre: "Infraestructura, descanso y bienestar"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Translocal; corresponde a UC para la Vida (bienestar)."
    critico: false
    instruccion: "¿El `comentario` pide infraestructura, lugares de descanso, dormitorios o bienestar?"
    criterio_true: "Menciona infraestructura, ampliación de sedes, dormitorios, laboratorios, lugares de descanso, bienestar o una cultura humana."
    criterio_false: "No menciona infraestructura ni bienestar."
    ejemplos_si: ["Mejor infraestructura, ampliación de las sedes, con dormitorios", "Lugares de descanso"]

  - id: ambiente_sostenibilidad
    nombre: "Medio ambiente y sostenibilidad"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Translocal de forma explícita."
    critico: false
    instruccion: "¿El `comentario` habla del medio ambiente, zonas verdes o desarrollo sostenible?"
    criterio_true: "Menciona medio ambiente, zonas verdes o desarrollo sostenible."
    criterio_false: "No menciona el ambiente ni la sostenibilidad."
    ejemplos_si: ["Más cuidado al medio ambiente", "más zonas verdes"]

  - id: emprendimiento_practicas
    nombre: "Emprendimiento, prácticas y realidad laboral"
    componente: fuera_de_la_transformacion
    justificacion: "No figura en la sección de UC Translocal; el documento lo ubica en UC Emprendedora e Innovadora."
    critico: false
    instruccion: "¿El `comentario` habla de emprendimiento, prácticas con empresas o la realidad laboral?"
    criterio_true: "Menciona emprendimiento, empresas para prácticas o la realidad laboral y competitiva."
    criterio_false: "No menciona emprendimiento, empresas ni realidad laboral."
    ejemplos_si: ["empresas que reconozcan a la universidad y la tengan en cuenta para que los estudiantes hagan sus prácticas", "El enfoque práctico de los estudiantes deberia estar orientado a la realidad laboral"]

sin_contenido: "¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?"
