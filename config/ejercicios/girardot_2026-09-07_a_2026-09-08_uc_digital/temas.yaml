# Temas v2 de Girardot · UC Digital (lista propia de esta unidad).
# Versión 2: menos temas (máx. 10) por fusión de los de la versión 1 (respaldada en temas_v1.yaml).
# Anclados a Transformaciones_estrategicas_5_frentes.md · '## 3. UC Digital' · líneas 66-82.
transformacion: UC Digital
version: 2.2
temas:
- id: tecnologias_emergentes
  nombre: 'Tecnologías emergentes: simuladores, realidad virtual y aumentada'
  componente: Tecnologías emergentes
  justificacion: 'Fusión de 2 temas afines de la versión 1 (simuladores, realidad virtual y aumentada, hologramas; más tecnologías emergentes en todas las áreas). Ancla: componente ''Tecnologías emergentes''.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: simuladores, realidad virtual y aumentada, hologramas; más tecnologías emergentes en todas las áreas?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Simuladores, realidad virtual y aumentada, hologramas: menciona simuladores, simulación, realidad virtual o aumentada, gafas de simulación,
    hologramas o dispositivos holográficos, laboratorios virtuales o simulados, o mesas inteligentes. (2) Más tecnologías emergentes en todas las áreas: pide de forma general, sin especificar qué, más tecnología,
    tecnologías emergentes, avanzadas o inteligentes, o que todo sea más digital.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Tener simuladores tecnológicos de pacientes que permitan practicar procedimientos
  - Aumento de tecnología emergentes
  fusiona_v1:
  - simuladores_realidad_virtual
  - mas_tecnologias_emergentes
- id: laboratorios_software
  nombre: Laboratorios, salas, software y licencias actualizados
  componente: fortalecer el aprendizaje
  otros_componentes:
  - Experiencia digital de la comunidad universitaria
  justificacion: 'Fusión de 2 temas afines de la versión 1 (laboratorios, salas y espacios tecnológicos; software, licencias y sistemas actualizados). Ancla: componente ''fortalecer el aprendizaje''; también
    toca: Experiencia digital de la comunidad universitaria.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: laboratorios, salas y espacios tecnológicos; software, licencias y sistemas actualizados?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Laboratorios, salas y espacios tecnológicos: menciona expresamente laboratorios, instrumentos de laboratorio, salas, salones, auditorio, centro
    de simulación o espacios especializados. (2) Software, licencias y sistemas actualizados: menciona licencias de software, software de la CMA, software especializado, actualizar los sistemas o soluciones
    tecnológicas inmediatas.'
  criterio_false: No cumple ninguno de esos casos de forma explícita. Simuladores, realidad virtual, hologramas o dispositivos sin mencionar un laboratorio, una sala, software o licencias no cuentan (tienen
    su propio tema).
  ejemplos_si:
  - La actualización del laboratorio de enfermería
  - ampliar o garantizar el tiempo suficiente de las licencias de los softwares
  fusiona_v1:
  - laboratorios_salas
  - software_licencias
- id: conectividad_comunicacion
  nombre: Conectividad, dispositivos y comunicación digital
  componente: Ecosistemas digitales
  justificacion: 'Fusión de 2 temas afines de la versión 1 (conectividad, wifi y acceso a dispositivos; comunicación digital directa y eficiente). Ancla: componente ''Ecosistemas digitales''.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: conectividad, wifi y acceso a dispositivos; comunicación digital directa y eficiente?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Conectividad, wifi y acceso a dispositivos: menciona internet, wifi, conectividad, cobertura, dispositivos (computadores, tablets) o accesibilidad
    tecnológica. (2) Comunicación digital directa y eficiente: menciona comunicación más directa entre estudiantes, profesores y universidad, comunicación eficiente o comunicación tecnológica entre áreas.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Se debe tener una conectividad total de los estudiantes tanto en casa como en la u
  - La comunicación entre estudiantes, profesores y universidad debería ser más directa
  fusiona_v1:
  - conectividad_dispositivos
  - comunicacion_digital
- id: tramites_cero_papel
  nombre: Trámites automatizados, sin burocracia y cero papel
  componente: Automatización de procesos
  otros_componentes:
  - Cero papel
  justificacion: 'Fusión de 2 temas afines de la versión 1 (trámites automatizados y sin burocracia; cero papel y registros digitales). Ancla: componente ''Automatización de procesos''; también toca: Cero
    papel.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: trámites automatizados y sin burocracia; cero papel y registros digitales?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Trámites automatizados y sin burocracia: menciona burocracia, procesos administrativos más rápidos, automatización de procesos, trámites, pagos
    o certificados en línea, matrícula ágil, asistentes administrativos o agilizar la entrada con el carné. (2) Cero papel y registros digitales: menciona cero papel, papel 0, registros digitales o evitar
    el consumo de papel.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Más digital y menos burocratico
  - Cero papel y acceso a las plataformas de la universidad
  fusiona_v1:
  - tramites_sin_burocracia
  - cero_papel
- id: inteligencia_artificial
  nombre: Inteligencia artificial de apoyo
  componente: Inteligencia artificial
  justificacion: 'Componente ''Inteligencia artificial'': IA de soporte por carrera, asistentes con IA, uso eficiente y estratégico de la IA.'
  critico: false
  instruccion: ¿El `comentario` habla de la inteligencia artificial (IA)?
  criterio_true: 'Menciona inteligencia artificial o IA: IA de soporte por carrera, asistente con IA, plataforma de IA, uso estratégico o eficiente de la IA o capacitar en IA.'
  criterio_false: No menciona la inteligencia artificial.
  ejemplos_si:
  - 'IA: implementar IA de soporte para cada carrera.'
  - Ofrecer por cada carrera una plataforma AI
- id: servicios_digitales
  nombre: 'Servicios digitales: biblioteca, información, seguridad y atención a la comunidad'
  componente: Servicios digitales
  justificacion: 'Fusión de 3 temas afines de la versión 1 (biblioteca digital, repositorios y acceso a la información; servicios a la comunidad y a los graduados mediados por tecnología; seguridad y control
    de acceso con tecnología). Ancla: componente ''Servicios digitales''.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: biblioteca digital, repositorios y acceso a la información; servicios a la comunidad y a los graduados mediados por tecnología;
    seguridad y control de acceso con tecnología?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Biblioteca digital, repositorios y acceso a la información: menciona biblioteca digital o virtual, repositorios, acceso fácil o en tiempo real
    a la información o al conocimiento, vademécum, pantallas informativas o ecosistema de información. (2) Servicios a la comunidad y a los graduados mediados por tecnología: menciona prestar servicios
    o consultoría a sectores externos, servicios de cuidado en la comunidad mediados por tecnología, herramientas o acceso a tecnología para graduados o apoyo a quien tenga un proyecto. (3) Seguridad y
    control de acceso con tecnología: menciona seguridad, sensores o carné para la entrada, lectura de placas o garantía de seguridad desde la entrada.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Conversión completa de la biblioteca a digital
  - Bajo una herramienta de graduados poder conectar las ofertas profesionales
  - Un tecnología que permita mejorar la seguridad
  fusiona_v1:
  - informacion_biblioteca_digital
  - servicios_comunidad_graduados
  - seguridad_acceso
- id: aprendizaje_capacitacion
  nombre: Aprendizaje remoto y flexible, y capacitación digital para la comunidad
  componente: Transformación digital
  otros_componentes:
  - Experiencia digital de la comunidad universitaria
  justificacion: 'Fusión de 2 temas afines de la versión 1 (aprendizaje remoto, flexible y personalizado; capacitación digital para toda la comunidad). Ancla: componente ''Transformación digital''; también
    toca: Experiencia digital de la comunidad universitaria.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos: aprendizaje remoto, flexible y personalizado; capacitación digital para toda la comunidad?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Aprendizaje remoto, flexible y personalizado: menciona clases sincrónicas o en tiempo real, grabaciones de clases, prácticas remotas, casos
    a distancia, aulas espejo, aprender desde cualquier lugar, recursos virtuales o personalizar el aprendizaje. (2) Capacitación digital para toda la comunidad: menciona capacitación, capacitaciones digitales,
    formación para el manejo de la tecnología, inducción o conocimientos básicos y avanzados para el personal, los estudiantes o la sociedad.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Prácticas remotas, casos de estudio a distancia
  - Capacitaciones digitales para todo el personal especialmente servicios generales
  fusiona_v1:
  - aprendizaje_remoto_flexible
  - capacitacion_digital
- id: humano_etica_limites
  nombre: 'Tecnología al servicio de lo humano: ética y límites'
  componente: transformacion_en_general
  justificacion: 'Comentarios sobre el enfoque de la transformación: la tecnología debe ser liberadora, no esclavizadora; no deshumanizar ni desplazar el trabajo; código de ética de la IA, pensamiento crítico
    y sin codependencia.'
  critico: false
  instruccion: ¿El `comentario` advierte que la tecnología o la IA no deben deshumanizar, reemplazar a las personas o eliminar el pensamiento crítico, o pide reglas éticas para su uso?
  criterio_true: Menciona que la IA o la tecnología ayude y no reemplace, no deshumanizar, enfoque humanista, que no desplace el campo laboral, sin codependencia, pensamiento crítico, ética o políticas
    de uso adecuado.
  criterio_false: Solo pide más tecnología o IA sin advertir sus límites.
  ejemplos_si:
  - La tecnología debe tener un sentido liberador, no esclavizador.
  - Código de ética del uso responsable de la IA
- id: conformidad
  nombre: Conformidad con la transformación (sin ajustes)
  componente: transformacion_en_general
  justificacion: 'Comentarios sobre la transformación como un todo: dicen expresamente que está correcta, alineada o que están de acuerdo.'
  critico: false
  instruccion: ¿El `comentario` dice expresamente que no haría ajustes o que está de acuerdo con la transformación tal como está?
  criterio_true: Dice de forma explícita que no ajustaría nada, que todo está correcto, que se ajusta, que está alineada o que está de acuerdo.
  criterio_false: Pide, propone o menciona cualquier cosa por mejorar.
  ejemplos_si:
  - no ajustaría nada
  - Me parece muy alineada a la realidad y a lo que viene a futuro
- id: otros_fuera
  nombre: Otros asuntos fuera de la transformación
  componente: fuera_de_la_transformacion
  justificacion: 'Asuntos sin anclaje en la sección de UC Digital del documento marco, cada uno con menos del 10 % de los comentarios; se agrupan en un solo tema (versión 2). Incluye: sostenibilidad ambiental
    de lo digital y energías renovables; redes e instituciones nacionales e internacionales; inclusión y accesibilidad para personas con discapacidad.'
  critico: false
  instruccion: '¿El `comentario` trata expresamente alguno de estos asuntos, que no son propios de UC Digital: sostenibilidad ambiental de lo digital y energías renovables; redes e instituciones nacionales
    e internacionales; inclusión y accesibilidad para personas con discapacidad?'
  criterio_true: 'Se cumple con cualquiera de estos casos. (1) Sostenibilidad ambiental de lo digital y energías renovables: menciona clasificación de residuos, energías renovables, tecnología limpia, recursos
    naturales, impacto o políticas ambientales o pensamiento sostenible. (2) Redes e instituciones nacionales e internacionales: menciona instituciones a nivel mundial, redes internacionales, otras IES
    o territorios nacionales e internacionales. (3) Inclusión y accesibilidad para personas con discapacidad: menciona personas con discapacidad, inclusión o apoyo tecnológico para la discapacidad.'
  criterio_false: No cumple ninguno de esos casos de forma explícita.
  ejemplos_si:
  - Tener una clasificación automática de residuos
  - El fortalecimiento de estrategias de diálogo con otras instituciones a nivel mundial
  - Mayor alcance para que personas con discapacidad puedan estudiar
  fusiona_v1:
  - ambiente_sostenibilidad
  - redes_internacionales
  - inclusion_discapacidad
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien' sin más detalle o un texto sin sentido?
