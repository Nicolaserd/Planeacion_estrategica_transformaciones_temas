T1-T2: T1 trata de cómo la institución se gobierna, decide y asegura su calidad; T2, de cómo la universidad y cada
  sede se vinculan con su territorio y proyectan su impacto. La acreditación institucional es T1; la acreditación
  internacional de programas es T2 (así aparece en el documento).
T1-T3: 'Los datos y la inteligencia artificial usados para decidir, medir resultados o asegurar la calidad son T1;
  la tecnología como medio para aprender, prestar servicios o automatizar procesos es T3. La inteligencia artificial
  figura en los componentes de ambas: un comentario puede tocar las dos, y la principal depende del propósito que
  exprese.'
T1-T4: La innovación organizacional para mejorar la gestión interna es T1; la innovación y el emprendimiento hacia
  afuera, para crear oportunidades y soluciones con los sectores, son T4.
T1-T5: 'Los procesos, la gestión y la calidad son T1; las personas (bienestar, cultura, talento humano, convivencia)
  son T5. La carga burocrática es T5 cuando el comentario habla de su efecto sobre las personas [Anexo: "reducir
  la carga burocrática del GCA"] y T1 cuando habla de la eficiencia del proceso.'
T2-T3: El alcance y la presencia en el territorio son T2; los medios digitales son T3. La educación virtual para
  llegar a otros municipios puede tocar ambas; la principal depende de si el énfasis está en el territorio o en
  la herramienta.
T2-T4: T2 es la pertinencia y el impacto de la formación, la investigación y la proyección social en el territorio,
  y la internacionalización; T4 es crear oportunidades y soluciones con los sectores mediante emprendimiento o innovación.
  Si el fin es emprender o innovar, es T4; si es estar presente o responder a la región, es T2.
T2-T5: La identidad y el sentido de pertenencia con la región o la sede son T2; la cultura institucional, la convivencia
  y el bienestar de la comunidad universitaria son T5.
T3-T4: Digitalizar procesos, servicios o el aprendizaje dentro de la universidad es T3; la innovación y el emprendimiento
  orientados a crear oportunidades con actores externos son T4. Los "ecosistemas digitales" son T3 y los "ecosistemas
  de innovación" son T4.
T3-T5: La tecnología es T3; el bienestar y el desarrollo humano son T5. Un servicio digital de bienestar puede tocar
  ambas; la principal depende de si se pide la herramienta o la atención a las personas.
T4-T5: 'Crear oportunidades de empleo, negocio o innovación con los sectores es T4; la formación de la persona,
  su bienestar y sus valores son T5. "Creadores de Oportunidades" y "Gestores del Conocimiento y el Aprendizaje"
  figuran como componentes de T5 y coinciden con los nombres de los tipos de actor del Excel (estudiantes y docentes):
  se leen como formación de esas personas, no como emprendimiento.'
