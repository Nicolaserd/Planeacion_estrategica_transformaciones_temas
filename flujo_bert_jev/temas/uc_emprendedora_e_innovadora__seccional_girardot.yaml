  justificacion: 'BERT agrupó estos comentarios (palabras clave: comunidad, oportunidades, emprendimiento, recursos, proyectos);
    tratan de que el comentario trata del apoyo de la universidad a las ideas, los proyectos o los emprendimientos de la comunidad:
    acompañamiento, recursos, oportunidades o soluciones, lo que corresponde a «Ecosistemas de innovación».'
  instruccion: '¿El `comentario` trata del apoyo de la universidad a las ideas, los proyectos o los emprendimientos de la
    comunidad: acompañamiento, recursos, oportunidades o soluciones?'
  criterio_true: 'Sí cuando el comentario trata del apoyo de la universidad a las ideas, los proyectos o los emprendimientos
    de la comunidad: acompañamiento, recursos, oportunidades o soluciones.'
  criterio_false: No cuando solo dice que no ajustaría nada o solo valora el encuentro.
  ejemplos_si:
  - La universidad tendría que brindar acompañamiento y orientación para desarrollar la idea, facilitando espacios de investigación,
    asesoría de docentes y expertos, recursos tecnológicos y apoyo financiero. Además, debería conectar a la persona con la
    comunidad y con entidades externas para probar la propuesta, mejorarla y convertirla en una solución viable que responda
    realmente a las necesidades del territorio.
  - La universidad debería brindar acompañamiento y orientación a la comunidad, ofreciendo espacios de capacitación, asesoría
    de docentes y profesionales, recursos y herramientas para desarrollar la idea. También podría facilitar alianzas con empresas,
    instituciones y entidades del territorio para conseguir apoyo y poner en práctica el proyecto. De esta manera, una idea
    que nace de una necesidad real podría convertirse en una solución que genere un impacto positivo en la comunidad.
  - Dar la oportunidad para desarrollar las ideas, conocer la institución para saber hacia donde dirigir para poder lograr
    el objetivo y que la universidad brinde el apoyo para realizar y llevar a cabo el objetivo
