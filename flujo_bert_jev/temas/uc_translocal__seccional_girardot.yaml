  componente: Impacto territorial
  justificacion: 'BERT agrupó estos comentarios (palabras clave: territorios, necesidades, comunidad, conocimiento, proyectos);
    tratan de que el comentario trata de los problemas y necesidades de los territorios y la comunidad, y de proyectos, conocimiento
    o innovación para resolverlos, lo que corresponde a «Impacto territorial».'
  instruccion: ¿El `comentario` trata de los problemas y necesidades de los territorios y la comunidad, y de proyectos, conocimiento
    o innovación para resolverlos?
  criterio_true: Sí cuando el comentario trata de los problemas y necesidades de los territorios y la comunidad, y de proyectos,
    conocimiento o innovación para resolverlos.
  criterio_false: No cuando trata principalmente de otro asunto del grupo, «Interacción entre sedes y territorios para el
