  ejemplos_si:
  - El ajuste en esta transformación que sugerimos sería en una mejor interacción social universitaria para poder hallar problemáticas
    y sus posibles soluciones, permitiendo un mayor impacto territorial
  - ¿Que podría lograr una universidad así? Solución de problemas territoriales donde se enlaza la población rural y urbana,
    extendiendo está misma a otros territorios con situaciones similares, además de la implementación de diferentes puntos
    de vista a partir de la investigación.
  - La Universidad podría lograr que cada territorio sea reconocido por lo que es, por sus saberes, su cultura y sus necesidades,
    pero que al mismo tiempo todos estén conectados como parte de una misma comunidad. No se trata de hacer que todos los
    territorios sean iguales, sino de aprovechar sus diferencias para compartir conocimientos, generar innovación y construir
