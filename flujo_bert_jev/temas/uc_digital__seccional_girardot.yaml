    cuando trata principalmente de otro asunto del grupo, «Simulación y realidad virtual para enfermería».
  ejemplos_si:
  - ¿Que debería ser posible en una universidad así?  Desarrollo de problemáticas de la era actual impulsadas por herramientas
    digitales y tecnologicas basadas en un pensamiento sostenible
  - En 10 años, una Universidad 100 % tecnológica debería permitir que la tecnología elimine barreras y amplíe las oportunidades.
    sin embargo no dejar de lado la humanización , la interacción, sin deshumanizar la educación. Me imagino una Universidad
