    laboratorios virtuales, y donde los docentes puedan utilizar la tecnología para personalizar el aprendizaje. Pero, sobre
    todo, una universidad donde la tecnología esté al servicio de las personas y del territorio, ayudándonos a convertir las
    necesidades de la comunidad en soluciones reales
  - 'Acceso a tecnologías, salones inteligentes, programas de capacitación a la sociedad, incluir translocalmente , es decir
