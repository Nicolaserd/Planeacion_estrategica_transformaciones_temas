  nombre: Identidad local abierta al mundo
  tema_bert: 0
  firma: local, comunidad, heterogéneo, proyectos, conocimiento
  palabras:
  - local
  - comunidad
  - heterogéneo
  - proyectos
  - conocimiento
  - redes académicas
  - territorio luego
  - cambiariamos identidad
  n_bert: 13
  componente: Identidad translocal
  justificacion: 'BERT agrupó estos comentarios (palabras clave: local, comunidad, heterogéneo, proyectos, conocimiento);
    tratan de que el comentario trata de lo local y lo heterogéneo, la identidad de cada territorio, la comunidad, las redes
    académicas o la apertura al mundo, lo que corresponde a «Identidad translocal».'
  instruccion: ¿El `comentario` trata de lo local y lo heterogéneo, la identidad de cada territorio, la comunidad, las redes
    académicas o la apertura al mundo?
  criterio_true: Sí cuando el comentario trata de lo local y lo heterogéneo, la identidad de cada territorio, la comunidad,
    las redes académicas o la apertura al mundo.
  criterio_false: 'No cuando trata principalmente de otro asunto del grupo, «Música, artes y conservatorio: visibilidad e
    interacción con otras sedes».'
  ejemplos_si:
  - Conversar con el ecosistema local ayuda a comprender lo heterogéneo y multicultural, para esto es necesario que la universidad
    sea consistente a nivel interno pero abierta al mundo.  La universidad gana cuando reconoce lo heterogéneo y se abre al
    mundo.   No sé puede pretender solo cundinamarca. El territorio y la definición de propio no son conceptos homogéneos.  El
    concepto de identidad translocal tiende a  ser ambiguo. Se puede pensar mejor en una apertura de cara mundo, reconociendo
    lo local.
  - Fortalecimiento en identidad y autonomía de cada territorio,sin fragmentar la identidad de la universidad. Contratar las
    metas propuestas con los elementos que nos ofrece el medit.
  - El enfoque, pues algunas veces está pensado solo en lo local, pues en nuestra área se debe pensar en internacionalizar
    los procesos formativos
  critico: false
  otros_componentes:
  - Internacionalización
