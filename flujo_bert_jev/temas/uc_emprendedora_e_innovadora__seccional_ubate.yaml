    de los procesos investigativos, brindando apoyo, recursos y equipos que permitan a los estudiantes y docentes desarrollar
    sus ideas. De esta manera, la investigación puede orientarse hacia la identificación y solución de problemáticas del territorio
    local, transformando las propuestas académicas en soluciones reales que generen impacto y contribuyan al desarrollo de
    la comunidad.
  - Ajustaría el acompañamiento de la universidad, para que las ideas de los estudiantes no se queden solo en propuestas,
