- id: t1_acompanamiento_recursos_para_convertir
  nombre: Acompañamiento y recursos para convertir ideas en soluciones
  tema_bert: 0
  firma: recursos, proyectos, soluciones, investigación, oportunidades
  palabras:
  - recursos
  - proyectos
  - soluciones
  - investigación
  - oportunidades
  - convertir idea
  - necesidades
  - comunidad
  n_bert: 31
  componente: Ecosistemas de innovación
  justificacion: 'BERT agrupó estos comentarios (palabras clave: recursos, proyectos, soluciones, investigación, oportunidades);
    tratan de que el comentario trata de convertir ideas en soluciones con recursos, proyectos, investigación, acompañamiento
    o seguimiento, lo que corresponde a «Ecosistemas de innovación».'
  instruccion: ¿El `comentario` trata de convertir ideas en soluciones con recursos, proyectos, investigación, acompañamiento
    o seguimiento?
  criterio_true: Sí cuando el comentario trata de convertir ideas en soluciones con recursos, proyectos, investigación, acompañamiento
    o seguimiento.
  criterio_false: No cuando trata principalmente de otro asunto del grupo, «Información y formación para el personal administrativo»
    o cuando trata principalmente de otro asunto del grupo, «Divulgar y apoyar el emprendimiento (incluye administrativos)».
  ejemplos_si:
  - Ajustaría la transformación para garantizar un acompañamiento continuo a las ideas que surgen de los territorios, con
    orientación, recursos, mentoría y seguimiento hasta su implementación. Así, la Universidad no solo identifica buenas ideas,
    sino que ayuda a convertirlas en soluciones sostenibles que generen un impacto real en la comunidad.
  - Para convertir una idea comunitaria en una solución real, la universidad debe articular el desarrollo tecnológico con
    la visión de negocios. Desde el programa de ingeniería de software, los estudiantes pueden construir el Producto Mínimo
    Viable (MVP) de la idea mediante proyectos de grado, semilleros o hackatones enfocados en los problemas del territorio.
    Simultáneamente, a través de su ecosistema de emprendimiento, la institución debe brindar incubación, mentoría interdisciplinaria
    y conexión con inversionistas para asegurar que ese software se transforme en un modelo de negocio escalable y sostenible
    para la región.
  - La universidad tiene que conocer la idea, así mismo plantear un plan de soluciones, ver si los recursos son viables para
    este entorno y llegar a una solución
  critico: false
