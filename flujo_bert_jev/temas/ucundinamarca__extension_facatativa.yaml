  justificacion: 'BERT agrupó estos comentarios (palabras clave: buena, buena gracias, buena orientacion, encuenta bueno,
    encuentros excelente); tratan de que el comentario valora positivamente el encuentro, la presentación o el Plan, o agradece,
    sin proponer nada concreto, lo que corresponde a «la transformación en general».'
  instruccion: '¿El `comentario` valora positivamente el encuentro, la presentación o el Plan, o agradece, sin proponer nada
    concreto (el comentario responde a «Comparte aquí tu aporte»; ejemplos: «excelente», «muy buena orientación», «gracias
    por todo»)?'
  criterio_true: 'Sí cuando el comentario valora positivamente el encuentro, la presentación o el Plan, o agradece, sin proponer
    nada concreto (el comentario responde a «Comparte aquí tu aporte»; ejemplos: «excelente», «muy buena orientación», «gracias
    por todo»).'
  criterio_false: No cuando propone o pide algo concreto para la universidad, aunque también agradezca.
  ejemplos_si:
