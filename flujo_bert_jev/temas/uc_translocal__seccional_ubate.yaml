    mater y formadora de futuros profesionales, debe propiciar espacios y estrategias que permitan vincular a los estudiantes
    con las necesidades, problemáticas y oportunidades del entorno local, fortaleciendo así su formación académica, social
    y profesional y generando un impacto positivo en la comunidad.
