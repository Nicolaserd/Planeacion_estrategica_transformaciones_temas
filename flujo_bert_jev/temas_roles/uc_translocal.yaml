transformacion: UC Translocal
version: 4
nota: Lista común y amplia (pocos temas, sin ceros por diseño) a partir de los temas de BERT por rol con las 7 unidades juntas;
  Jev la aplica a todos los comentarios del formulario. La conformidad (especial) se reporta aparte.
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien'
  sin más detalle o un texto sin sentido?
temas:
- id: territorio_necesidades_soluciones
  nombre: Conexión con el territorio y soluciones a sus necesidades
  componente: Impacto territorial
  otros_componentes:
  - Interacción Social Universitaria
  origen:
  - grupo: uc_translocal__rol_estudiantes
    tema_bert: 0
    firma: estudiantes, necesidades, interacción, soluciones, comunidad
  - grupo: uc_translocal__rol_docentes
    tema_bert: 1
    firma: territorio, proyectos, conocimiento, comunidad, investigación
  - grupo: uc_translocal__rol_administrativos
    tema_bert: 1
    firma: comunidad, programas, administrativos, necesidades, educación
  - grupo: uc_translocal__rol_graduados
    tema_bert: 1
    firma: estudiantes, social, universitaria, universidades, región
  justificacion: Los comentarios piden que la universidad conozca las realidades de cada territorio y responda a sus necesidades
    con formación, investigación, proyectos u oportunidades, que es el impacto territorial de la transformación.
  instruccion: ¿El `comentario` habla, aunque sea brevemente, del territorio, la región, los municipios o la comunidad local,
    por ejemplo conocer sus necesidades o problemas, llegar a ellos o generar soluciones, oportunidades o impacto social?
  criterio_true: Menciona el territorio, la región, los municipios, el entorno o la comunidad local, sus necesidades o problemáticas,
    el impacto social, la presencia de la universidad allí, o soluciones y oportunidades para ellos.
  criterio_false: No menciona el territorio ni la comunidad local.
  ejemplos_si:
  - Una universidad así podría fortalecer la identidad de cada territorio, aprovechar sus recursos y conectar a las comunidades
    para generar oportunidades y soluciones a sus necesidades.
  - Que la universidad conozca tambien su territorio e identifique las necesidades con las que conviven sus estudiantes
  critico: false
- id: integracion_sedes_redes
  nombre: Integración entre sedes, grupos de interés y regiones; redes y cooperación
  componente: Redes y cooperación
  otros_componentes:
  - Internacionalización
  origen:
  - grupo: uc_translocal__rol_docentes
    tema_bert: 0
    firma: redes, comunidades, problemáticas, territorios, internacional
  - grupo: uc_translocal__rol_administrativos
    tema_bert: 0
    firma: necesidades, regionales, internacional, nacional, comunidades
  - grupo: uc_translocal__rol_administrativos
    tema_bert: 2
    firma: procesos, administrativa, administrativos, optimizar, institucional
  justificacion: Los comentarios piden integrar las sedes, seccionales y extensiones y a todos sus grupos de interés, crear sinergias
    y redes, y cooperar con otras instituciones en el país y en el exterior, que corresponde a redes y cooperación e internacionalización.
  instruccion: ¿El `comentario` habla, aunque sea brevemente, de integrar, articular o conectar las sedes, seccionales, extensiones,
    programas o actores de la universidad, de redes, convenios o cooperación, o de la proyección nacional o internacional?
  criterio_true: Menciona integración, articulación, unión, conexión, interacción o intercambio entre sedes, regiones, programas
    o actores (incluidos los administrativos); redes, sinergias, convenios, cooperación, movilidad o internacionalización.
  criterio_false: No menciona integración, redes ni cooperación.
  ejemplos_si:
  - Mayor integración entre sus sedes y territorios, reconociendo las necesidades particulares de cada región.
  - Involucrar de manera más dinámica a los administrativos
  critico: false
- id: programas_proyectos_pertinentes
  nombre: Programas, proyectos y prácticas pertinentes al territorio
  componente: Formación y aprendizaje
  otros_componentes:
  - Ciencia, tecnología e innovación
  origen:
  - grupo: uc_translocal__rol_estudiantes
    tema_bert: 1
    firma: programas, proyectos, entorno, conocimiento, necesidades
  - grupo: uc_translocal__rol_graduados
    tema_bert: 0
    firma: necesidades, desarrollo, empresarial, oportunidades, servicios
  justificacion: Los comentarios proponen programas, proyectos conjuntos, semilleros y prácticas que respondan a la realidad
    del territorio y del mercado laboral, lo que corresponde a formación y aprendizaje y a ciencia, tecnología e innovación.
  instruccion: ¿El `comentario` habla, aunque sea brevemente, de los programas académicos, la oferta, la formación, los proyectos,
    los semilleros, las prácticas, la investigación o el empleo y el emprendimiento de los egresados?
  criterio_true: Menciona programas, carreras u oferta académica, formación, pensum, proyectos, semilleros, investigación,
    prácticas, eventos académicos, o el empleo o el emprendimiento de los egresados.
  criterio_false: No menciona nada académico ni de formación.
  ejemplos_si:
  - Poder de esta manera realizar proyectos conjuntos desde los diferentes programas articulando conocimientos
  - La coherencia, la afinidad a la realidad y el ajuste de los programas a las necesidadss del territorio
  critico: false
- id: cultura_identidad_regional
  nombre: Cultura e identidad de cada territorio
  componente: Identidad translocal
  origen:
  - grupo: uc_translocal__rol_estudiantes
    tema_bert: 2
    firma: cultura, cultural, culturas, territorios, integración
  justificacion: Los comentarios piden reconocer y respetar la cultura, las tradiciones, la diversidad y el sentido de pertenencia
    de cada territorio, que es la identidad translocal.
  instruccion: ¿El `comentario` habla, aunque sea brevemente, de la cultura, las tradiciones, la diversidad, la identidad
    o el sentido de pertenencia de los territorios, de la región o de la universidad?
  criterio_true: Menciona cultura, tradiciones, arte, diversidad, identidad, sentido de pertenencia, imagen de la universidad
    o espacios de integración cultural.
  criterio_false: No menciona cultura, identidad ni pertenencia.
  ejemplos_si:
  - Respetar la cultura de cada territorio y tomar decisiones tomando en cuenta sus necesidades translocales
  - Más espacios de integración cultural
  critico: false
- id: conformidad_sin_propuestas
  nombre: Conformidad o sin propuestas por ahora
  componente: transformacion_en_general
  especial: conformidad
  origen:
  - grupo: uc_translocal__rol_estudiantes
    tema_bert: 3
    firma: inglés, espacios, mejorar, orden, opciones
  justificacion: Los comentarios dicen que no harían ajustes, que la transformación está completa o que no tienen propuestas
    por ahora; se refieren a la transformación como un todo.
  instruccion: La pregunta de la encuesta fue «¿Qué ajustaría en esta transformación?». ¿El `comentario` responde que no haría
    ajustes, que está de acuerdo o que la transformación está bien enfocada, que no tiene propuestas por ahora, o la valora
    positivamente sin pedir cambios, por ejemplo «está bien», «de acuerdo», «nada por el momento», «excelente» o «está bien
    enfocado el propósito»? Los testimonios sobre cómo la universidad cambió la vida de alguien no cuentan.
  criterio_true: Dice que no ajustaría nada, que está de acuerdo, que está bien o bien enfocada, que no tiene propuestas por
    ahora, o la valora positivamente sin pedir cambios, aunque sea en pocas palabras.
  criterio_false: Propone, pide o critica algo concreto. Tampoco cuentan un agradecimiento solo («gracias») ni los testimonios
    sobre lo que la universidad ha significado o cómo transformó la vida de alguien.
  ejemplos_si:
  - Ninguna, todo está completo
  - Nada por el momento
  critico: false
