transformacion: UC Emprendedora e Innovadora
version: 4
nota: Lista común y amplia (pocos temas, sin ceros por diseño) a partir de los temas de BERT por rol con las 7 unidades juntas;
  Jev la aplica a todos los comentarios del formulario. La conformidad (especial) se reporta aparte.
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien'
  sin más detalle o un texto sin sentido?
temas:
- id: acompanamiento_ideas
  nombre: Acompañamiento, asesoría y recursos para llevar las ideas a soluciones
  componente: Ecosistemas de innovación
  otros_componentes:
  - Innovación social
  origen:
  - grupo: uc_emprendedora_e_innovadora__rol_estudiantes
    tema_bert: 0
    firma: ideas, comunidad, propuesta, problemáticas, ayuda
  - grupo: uc_emprendedora_e_innovadora__rol_estudiantes
    tema_bert: 1
    firma: idea, investigación, comunidad, estudiantes, soluciones
  - grupo: uc_emprendedora_e_innovadora__rol_docentes
    tema_bert: 0
    firma: proyectos, emprendimiento, comunidad, recursos, soluciones
  - grupo: uc_emprendedora_e_innovadora__rol_administrativos
    tema_bert: 0
    firma: comunidad, ideas, investigación, aportar, conocimiento
  - grupo: uc_emprendedora_e_innovadora__rol_graduados
    tema_bert: 0
    firma: necesidades, comunidad, emprendimiento, oportunidades, ideas
  - grupo: uc_emprendedora_e_innovadora__rol_graduados
    tema_bert: 1
    firma: estudiantes, graduados, proyectos, ideas, investigación
  justificacion: Los comentarios piden que la universidad escuche las ideas de la comunidad y las acompañe con asesoría, investigación,
    recursos y seguimiento hasta convertirlas en soluciones para el territorio, lo que corresponde a los ecosistemas de innovación
    y la innovación social.
  instruccion: ¿El `comentario` habla, aunque sea brevemente, de apoyar las ideas, propuestas o proyectos de la comunidad,
    por ejemplo escucharlas, orientarlas, asesorarlas, investigarlas, darles recursos, mentoría o seguimiento, o convertirlas
    en soluciones?
  criterio_true: Menciona escuchar, evaluar o diagnosticar ideas o propuestas, acompañamiento, orientación, asesoría, mentoría,
    investigación, espacios de innovación, recursos, herramientas o seguimiento para desarrollar ideas o proyectos.
  criterio_false: No menciona el apoyo a ideas o proyectos.
  ejemplos_si:
  - Escuchar, asesorar, brindar los recursos necesarios para ejecutar la idea planteada
  - La universidad debería escuchar y acompañar la idea desde el inicio, brindando orientación, espacios de innovación, formación,
    asesoría y recursos
  critico: false
- id: apoyo_emprendimiento
  nombre: 'Apoyo al emprendimiento: financiación, divulgación y vinculación de toda la comunidad'
  componente: Emprendimiento
  origen:
  - grupo: uc_emprendedora_e_innovadora__rol_estudiantes
    tema_bert: 2
    firma: emprendimiento, económico, creador oportunidades, ideas, emprendimientos
  - grupo: uc_emprendedora_e_innovadora__rol_administrativos
    tema_bert: 1
    firma: emprendimiento, innovación, información, oportunidades, conocimiento
  justificacion: Los comentarios piden apoyo económico y financiero para los emprendimientos, divulgar la oferta de emprendimiento
    e innovación y vincular a toda la comunidad, incluidos los administrativos, lo que corresponde al componente de emprendimiento.
  instruccion: ¿El `comentario` habla, aunque sea brevemente, del emprendimiento o la innovación, por ejemplo apoyo económico,
    financiación, recursos, inversión, rutas para emprender, empresas, divulgación de la oferta o vinculación de toda la comunidad?
  criterio_true: Menciona emprendimiento, emprendedores, empresas, innovación, apoyo económico, financiación, capital semilla,
    inversión, rutas o planeación para emprender, divulgar la oferta o incluir a toda la comunidad en ella.
  criterio_false: No menciona emprendimiento, innovación ni financiación.
  ejemplos_si:
  - Puede apoyar, consolidando la idea, apoyando y dirigiendo al creador de oportunidades, también puede ayudar económicamente
  - Realizar Socializaciones de la oferta de emprendimiento e innovación, para administrativos
  critico: false
- id: convenios_alianzas_procesos
  nombre: Convenios, alianzas y procesos ágiles para ejecutar los proyectos
  componente: Relacionamiento con los sectores sociales, productivos, públicos y comunitarios
  origen:
  - grupo: uc_emprendedora_e_innovadora__rol_docentes
    tema_bert: 1
    firma: procesos, recursos, necesidades, proyectos, convenios
  justificacion: Los comentarios piden agilizar los convenios y los procesos, definir estrategias de seguimiento y articularse
    con empresas, entidades y comunidades para ejecutar las propuestas, lo que corresponde al relacionamiento con los sectores
    sociales, productivos, públicos y comunitarios.
  instruccion: ¿El `comentario` habla, aunque sea brevemente, de convenios, alianzas o articulación con empresas, entidades,
    instituciones o comunidades, o de los procesos, la planeación, las estrategias y el seguimiento para ejecutar los proyectos?
  criterio_true: Menciona convenios, alianzas, vínculos o articulación con empresas, el sector productivo, entidades públicas,
    instituciones o comunidades, o procesos, trámites, planeación, estrategias, tiempos o seguimiento para ejecutar lo propuesto.
  criterio_false: No menciona convenios, alianzas ni procesos para ejecutar proyectos.
  ejemplos_si:
  - La parte del agilizar los procesos de convenio
  - Evaluar estrategias de seguimiento y concretar las decisiones tomadas
  critico: false
- id: conformidad_sin_propuestas
  nombre: Conformidad o sin propuestas por ahora
  componente: transformacion_en_general
  especial: conformidad
  origen:
  - grupo: uc_emprendedora_e_innovadora__rol_estudiantes
    tema_bert: 3
    firma: momento, semilla, dan, aplicar, buscar
  justificacion: Los comentarios dicen que no harían ajustes o que no tienen propuestas por ahora; se refieren a la transformación
    como un todo.
  instruccion: La pregunta de la encuesta fue «¿Qué ajustaría en esta transformación?». ¿El `comentario` responde que no haría
    ajustes, que está de acuerdo o que la transformación está bien enfocada, que no tiene propuestas por ahora, o la valora
    positivamente sin pedir cambios, por ejemplo «está bien», «de acuerdo», «nada por el momento», «excelente» o «está bien
    enfocado el propósito»? Los testimonios sobre cómo la universidad cambió la vida de alguien no cuentan.
  criterio_true: Dice que no ajustaría nada, que está de acuerdo, que está bien o bien enfocada, que no tiene propuestas por
    ahora, o la valora positivamente sin pedir cambios, aunque sea en pocas palabras.
  criterio_false: Propone, pide o critica algo concreto. Tampoco cuentan un agradecimiento solo («gracias») ni los testimonios
    sobre lo que la universidad ha significado o cómo transformó la vida de alguien.
  ejemplos_si:
  - Nada de momento
  - Por el momento nada
  critico: false
