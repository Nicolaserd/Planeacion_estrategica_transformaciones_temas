transformacion: UC para la Vida
version: 2
nota: Lista común y amplia (pocos temas, sin ceros por diseño) a partir de los temas de BERT por rol con las 7 unidades juntas;
  Jev la aplica a todos los comentarios del formulario. La conformidad (especial) se reporta aparte.
sin_contenido: ¿El `comentario` carece de contenido evaluable, por ejemplo una respuesta vacía, un 'nada', un 'todo bien'
  sin más detalle o un texto sin sentido?
temas:
- id: oportunidades_practicas_formacion
  nombre: Oportunidades, prácticas y experiencias formativas para la vida profesional
  componente: Creadores de Oportunidades
  otros_componentes:
  - Gestores del Conocimiento y el Aprendizaje
  origen:
  - grupo: uc_para_la_vida__rol_estudiantes
    tema_bert: 0
    firma: vida, estudiantes, oportunidades, desarrollo, bienestar
  - grupo: uc_para_la_vida__rol_estudiantes
    tema_bert: 1
    firma: laboral, bienestar, estudiantes, proyectos, experiencia
  - grupo: uc_para_la_vida__rol_graduados
    tema_bert: 1
    firma: oportunidades, bienestar, experiencia, exigencias, sociedad
  justificacion: Los comentarios piden oportunidades reales, prácticas, salidas pedagógicas, movilidad y una formación que
    vaya más allá de lo teórico y prepare para la vida y el trabajo, lo que corresponde al componente Creadores de Oportunidades.
  instruccion: ¿El `comentario` trata de las oportunidades y experiencias formativas que la universidad debería ofrecer, por
    ejemplo prácticas, pasantías, salidas pedagógicas, movilidad, eventos, formación práctica más allá de lo teórico, acompañamiento
    o preparación para la vida laboral?
  criterio_true: Menciona oportunidades de práctica, pasantía, empleo o vinculación laboral, salidas pedagógicas, movilidad
    o intercambios, eventos o espacios formativos, formación práctica o integral, acompañamiento al estudiante o al egresado,
    o preparación para el trabajo.
  criterio_false: No habla de oportunidades ni de experiencias formativas. Las condiciones laborales del personal tienen su
    propio tema; contar cómo la universidad le cambió la vida, sin pedir oportunidades, tiene su propio tema.
  ejemplos_si:
  - Poder tener más experiencia de salidas pedagógicas ya que permite unir la teoría con la práctica
  - Necesidades de los egresados, y poder gestionar oportunidades de manera laboral
  critico: false
- id: bienestar_salud_mental
  nombre: Bienestar, salud mental y calidad de vida de la comunidad
  componente: Felicidad y bienestar
  origen:
  - grupo: uc_para_la_vida__rol_docentes
    tema_bert: 1
    firma: bienestar, laboral, gestores, estabilidad laboral, experiencias
  - grupo: uc_para_la_vida__rol_graduados
    tema_bert: 0
    firma: bienestar, experiencias, graduados, oportunidades, estudiantes
  justificacion: Los comentarios piden fortalecer el bienestar, la salud mental, el equilibrio entre trabajo y vida y la calidad
    de vida de estudiantes, docentes, administrativos y graduados, lo que corresponde a felicidad y bienestar.
  instruccion: ¿El `comentario` trata del bienestar, la salud física o mental, la calidad de vida, la felicidad o el equilibrio
    entre trabajo y vida personal de estudiantes, docentes, administrativos o graduados?
  criterio_true: Menciona bienestar, salud mental o emocional, calidad de vida, felicidad, equilibrio entre trabajo y vida,
    acompañamiento psicológico, actividades de bienestar o una universidad más humana con sus integrantes.
  criterio_false: No habla de bienestar ni de salud. Las condiciones de contratación, estabilidad o salario tienen su propio
    tema; las prácticas y oportunidades formativas tienen su propio tema.
  ejemplos_si:
  - Propongo que la Universidad de Cundinamarca fortalezca, durante los próximos diez años, una cultura institucional que
    priorice la salud mental, el bienestar
  - Siendo más humana con el gestor y poder hacer un equilibro entre el bienestar y el trabajo.
  critico: false
- id: condiciones_talento_humano
  nombre: Condiciones laborales, estabilidad y formación del personal
  componente: Desarrollo del talento humano
  otros_componentes:
  - Gestores del Conocimiento y el Aprendizaje
  origen:
  - grupo: uc_para_la_vida__rol_docentes
    tema_bert: 0
    firma: formación, gestores, laboral, oportunidades, contratación
  - grupo: uc_para_la_vida__rol_administrativos
    tema_bert: 0
    firma: laboral, bienestar, administrativos, mejorar, experiencia
  justificacion: Los comentarios piden estabilidad laboral, mejor contratación y remuneración, y oportunidades de formación
    y crecimiento para docentes y administrativos, lo que corresponde al desarrollo del talento humano.
  instruccion: ¿El `comentario` trata de las condiciones laborales del personal de la universidad (docentes o administrativos),
    por ejemplo contratación, estabilidad, salario, carga de trabajo, reconocimiento, formación posgradual o crecimiento profesional?
  criterio_true: Menciona contratación, planta o provisionalidad, estabilidad laboral, salario o remuneración, carga laboral,
    incentivos o reconocimiento, apoyo para estudios o formación del personal, categorización o crecimiento laboral de docentes
    o administrativos.
  criterio_false: No habla de las condiciones del personal. El bienestar o la salud mental, sin referirse a contratación,
    salario o formación del personal, tiene su propio tema.
  ejemplos_si:
  - Mayor estabilidad laboral, ampliar las oportunidades de estudio y formación para el personal
  - Provisionalidad en la contratación docente, apoyo en la formación académica, calidad de vida
  critico: false
- id: transformacion_personal
  nombre: La universidad que transforma la vida y la forma de pensar
  componente: Persona Transhumana
  origen:
  - grupo: uc_para_la_vida__rol_estudiantes
    tema_bert: 2
    firma: experiencias, vida, conocimientos, experiencia, pensamiento
  - grupo: uc_para_la_vida__rol_administrativos
    tema_bert: 1
    firma: vida, aprendizaje, bienestar, comunidad, oportunidades
  justificacion: Los comentarios cuentan cómo la universidad transforma la vida, los valores y la forma de pensar de las personas,
    lo que corresponde a la formación de la Persona Transhumana.
  instruccion: ¿El `comentario` trata de cómo la universidad transforma o puede transformar la vida, los valores, la forma
    de pensar o el crecimiento personal de quienes pasan por ella, incluidos los testimonios sobre ese cambio?
  criterio_true: Cuenta o propone que la universidad cambia la vida, la manera de pensar, los valores o la forma de relacionarse,
    que forma personas más allá de lo académico, o describe experiencias que dejaron un aprendizaje para la vida.
  criterio_false: No habla de transformación personal. Pedir prácticas u oportunidades laborales tiene su propio tema; el
    bienestar y la salud mental tienen su propio tema.
  ejemplos_si:
  - Conocer diferentes realidades de vida permite transformar el pensamiento
  - La universidad transforma la vida por los valores que enseñan honestidad transparencia.
  critico: false
- id: conformidad_esta_bien
  nombre: 'Conformidad: la transformación está bien así'
  componente: transformacion_en_general
  especial: conformidad
  origen:
  - grupo: uc_para_la_vida__rol_estudiantes
    tema_bert: 3
    firma: parece, encuentro, adecuado, términos, organización
  justificacion: Los comentarios expresan acuerdo con la transformación sin proponer ajustes; se refieren a la transformación
    como un todo.
  instruccion: La pregunta de la encuesta fue «¿Qué ajustaría en esta transformación?». ¿El `comentario` responde que no haría
    ajustes o que está de acuerdo con la transformación tal como está, por ejemplo «está bien», «así está bien», «todo está
    adecuado» o «ninguno, está perfecta»?
  criterio_true: Dice expresamente que no ajustaría nada, que está bien así o que está de acuerdo con la transformación, aunque
    sea en pocas palabras.
  criterio_false: Propone, pide o critica algo concreto. Los testimonios sobre cómo la universidad cambió la vida y los agradecimientos
    no cuentan como conformidad.
  ejemplos_si:
  - Esta bien
  - Creo que todo está adecuado
  critico: false
